name: trinex_admin
description: TRINEX Admin — native Flutter administration app for Android and Windows.
publish_to: "none"
version: 1.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.29.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.3.0
  http_parser: ^4.1.2
  file_picker: ^8.1.7
  csv: ^6.0.0
  excel: ^4.0.6
  image: ^4.3.0
  pdfx: ^2.8.0
  flutter_secure_storage: ^9.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  windows:
    generate: true
    image_path: "assets/icon/trinex_admin.png"
    icon_size: 256
  image_path: "assets/icon/trinex_admin.png"
  adaptive_icon_background: "#0A172D"
  adaptive_icon_foreground: "assets/icon/trinex_admin.png"
