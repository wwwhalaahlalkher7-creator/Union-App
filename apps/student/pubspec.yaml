name: leo_association
description: TRINEX — Engineering, Architecture & Technology student platform.
publish_to: "none"
version: 2.0.4+3

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.4.0
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  flutter_local_notifications: ^19.4.2
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^10.3.4
  flutter_localizations:
    sdk: flutter
  go_router: ^16.0.0
  url_launcher: ^6.3.2
  file_picker: ^8.3.7
  record: ^6.1.1
  audioplayers: ^6.5.0
  path_provider: ^2.1.5
  pdfrx: ^2.6.5
  latext: ^0.5.1
  sensors_plus: ^6.1.2

# Keep the Android plugin on the stable pre-JNI implementation.
# shared_preferences_android 2.5.0 changed its native bridge to Pigeon JNI;
# the current production APK comparison showed this bridge differs from the
# last known working build. Revisit only after device startup is verified.
dependency_overrides:
  shared_preferences_android: 2.4.25

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
