version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/backend"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      backend-npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pub
    directory: "/flutter"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      flutter-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: "/flutter/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      android-minor-patch:
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
    groups:
      github-actions-updates:
        patterns:
          - "*"
