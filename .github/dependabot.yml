version: 2
updates:
  # Root tooling has no third-party runtime dependencies today, but keep this
  # entry so future root-level npm dependencies are monitored.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: "Africa/Khartoum"
    open-pull-requests-limit: 3
    groups:
      root-npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: npm
    directory: "/services/api"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:15"
      timezone: "Africa/Khartoum"
    open-pull-requests-limit: 5
    groups:
      api-npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pub
    directory: "/apps/student"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:30"
      timezone: "Africa/Khartoum"
    open-pull-requests-limit: 5
    groups:
      student-pub-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: pub
    directory: "/apps/admin"
    schedule:
      interval: weekly
      day: wednesday
      time: "06:45"
      timezone: "Africa/Khartoum"
    open-pull-requests-limit: 5
    groups:
      admin-pub-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: gradle
    directory: "/apps/student/android"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:00"
      timezone: "Africa/Khartoum"
    open-pull-requests-limit: 3
    groups:
      student-android-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: wednesday
      time: "07:15"
      timezone: "Africa/Khartoum"
    open-pull-requests-limit: 5
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
