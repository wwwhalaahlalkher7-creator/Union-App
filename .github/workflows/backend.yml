name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ci/admin_crud_check.py'
      - 'ci/auth_hardening_check.py'
      - '.github/workflows/backend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'backend/**'
      - 'ci/admin_crud_check.py'
      - 'ci/auth_hardening_check.py'
      - '.github/workflows/backend.yml'
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate package.json
        run: node -e "JSON.parse(require('fs').readFileSync('package.json','utf8')); console.log('backend package.json OK')"

      - name: Check Worker syntax
        run: node --check src/index.js

      - name: Check Dashboard adapter syntax
        working-directory: website/dashboard/js
        run: node --check api-adapter.js

      - name: Admin CRUD contract tests
        working-directory: .
        run: python3 ci/admin_crud_check.py

      - name: Authentication hardening contract tests
        working-directory: .
        run: python3 ci/auth_hardening_check.py

      - name: Migration smoke test
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import sqlite3

          con = sqlite3.connect(':memory:')
          migrations = sorted(Path('migrations').glob('*.sql'))
          if not migrations:
              raise SystemExit('No migration files found')

          for path in migrations:
              print(f'Applying {path.name}')
              con.executescript(path.read_text(encoding='utf-8'))

          tables = con.execute(
              "SELECT COUNT(*) FROM sqlite_master WHERE type='table'"
          ).fetchone()[0]

          if tables < 1:
              raise SystemExit('Migration smoke test produced no tables')

          print(f'Migration smoke test passed: {tables} tables')
          PY

  deploy:
    name: Deploy Backend to Cloudflare
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Apply D1 migrations
        run: npm run migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Keep the Eino credentials out of the repository. GitHub Secrets are
      # copied directly into a temporary secrets file and uploaded with the
      # same Worker deployment. The file is removed immediately afterwards.
      - name: Prepare Eino production secrets
        env:
          OMNIROUTE_BASE_URL: ${{ secrets.OMNIROUTE_BASE_URL }}
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
        run: |
          test -n "$OMNIROUTE_BASE_URL" || { echo 'Missing GitHub Secret: OMNIROUTE_BASE_URL'; exit 1; }
          test -n "$OMNIROUTE_API_KEY" || { echo 'Missing GitHub Secret: OMNIROUTE_API_KEY'; exit 1; }
          python3 - <<'PY'
          import json, os
          data = {
              "OMNIROUTE_BASE_URL": os.environ["OMNIROUTE_BASE_URL"],
              "OMNIROUTE_API_KEY": os.environ["OMNIROUTE_API_KEY"],
          }
          with open('.eino.secrets.json', 'w', encoding='utf-8') as f:
              json.dump(data, f)
          PY

      - name: Deploy Worker with Eino secrets
        run: npx wrangler deploy --secrets-file .eino.secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Remove temporary secret file
        if: always()
        run: rm -f .eino.secrets.json
