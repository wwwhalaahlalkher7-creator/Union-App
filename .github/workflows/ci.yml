name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      student: ${{ steps.detect.outputs.student }}
      admin: ${{ steps.detect.outputs.admin }}
      backend: ${{ steps.detect.outputs.backend }}
      website: ${{ steps.detect.outputs.website }}
      shared: ${{ steps.detect.outputs.shared }}
      backend_deploy: ${{ steps.detect.outputs.backend_deploy }}
      website_deploy: ${{ steps.detect.outputs.website_deploy }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Detect affected components
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          student=false; admin=false; backend=false; website=false; shared=false
          backend_deploy=false; website_deploy=false
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            student=true; admin=true; backend=true; website=true; shared=true
          elif [[ "$EVENT_NAME" == "push" && ( -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ) ]]; then
            # On the first push into a fresh-history repository, validate every component
            # but do not auto-deploy production as a side effect of bootstrapping the repo.
            student=true; admin=true; backend=true; website=true; shared=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
            else
              base="$BEFORE_SHA"
            fi
            if [[ -z "${base:-}" ]] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              student=true; admin=true; backend=true; website=true; shared=true
            else
              changed="$(git diff --name-only "$base" "$HEAD_SHA")"
              printf 'Changed files:\n%s\n' "$changed"
              while IFS= read -r file; do
                [[ -z "$file" ]] && continue
                case "$file" in
                  apps/student/*) student=true ;;
                  apps/admin/*) admin=true ;;
                  services/api/*) backend=true ;;
                  web/portal/*) website=true ;;
                  ci/*|.github/*|README.md|CONTRIBUTING.md|SECURITY.md|.gitignore|.gitattributes|.env.example|package.json|build.js|docs/*) shared=true ;;
                esac
              done <<< "$changed"
              if [[ "$EVENT_NAME" == "push" ]]; then
                backend_deploy="$backend"
                website_deploy="$website"
              fi
            fi
          fi
          echo "student=$student" >> "$GITHUB_OUTPUT"
          echo "admin=$admin" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "shared=$shared" >> "$GITHUB_OUTPUT"
          echo "backend_deploy=$backend_deploy" >> "$GITHUB_OUTPUT"
          echo "website_deploy=$website_deploy" >> "$GITHUB_OUTPUT"

  flutter_gate:
    name: Check Flutter Changes
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.flutter_changes.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether Flutter needs to run
        id: flutter_changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A manual run always validates Flutter. For push/PR, Flutter runs only
          # when Flutter code or a file that directly affects its CI/release checks changes.
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Flutter CI: manual run -> RUN"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "push" && ( -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ) ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Flutter CI: first push to new history -> RUN"
            exit 0
          fi

          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base="$BASE_SHA"
          else
            base="$BEFORE_SHA"
            if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
              base="$(git rev-list --max-parents=0 HEAD)"
            fi
          fi

          changed="$(git diff --name-only "$base" "$HEAD_SHA")"
          echo "Changed files:"
          printf '%s\n' "$changed"

          run=false
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            case "$file" in
              apps/student/*|\
              ci/flutter_secure_storage_check.py|\
              ci/offline_cache_check.py|\
              ci/color_theme_check.py|\
              ci/release_check.py|\
              ci/final_release_check.py|\
              ci/verify_project.py|\
              ci/workflow_consistency_check.py|\
              ci/drive_library_reconciliation_check.py|\
              ci/version_consistency_check.py|\
              README.md|.env.example|services/api/wrangler.toml|\
              .github/workflows/ci.yml)
                run=true
                break
                ;;
            esac
          done <<< "$changed"

          echo "run=$run" >> "$GITHUB_OUTPUT"
          if [[ "$run" == "true" ]]; then
            echo "Flutter CI: relevant changes detected -> RUN"
          else
            echo "Flutter CI: no relevant changes detected -> SKIP"
          fi

  flutter:
    name: Flutter Analyze, Test & Main Artifacts
    needs: flutter_gate
    if: needs.flutter_gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/student
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Synchronize version from canonical VERSION
        run: python3 tool/sync_version.py

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Project verification
        working-directory: .
        run: python3 ci/verify_project.py

      - name: Workflow consistency
        working-directory: .
        run: python3 ci/workflow_consistency_check.py

      - name: Flutter release-safety checks
        working-directory: .
        run: |
          python3 ci/release_check.py
          python3 ci/final_release_check.py
          python3 ci/flutter_secure_storage_check.py
          python3 ci/offline_cache_check.py
          python3 ci/color_theme_check.py
          python3 ci/version_consistency_check.py
          python3 ci/drive_library_reconciliation_check.py
          python3 ci/study_tutorial_trigger_check.py
          python3 ci/eino_orb_motion_check.py

      # Dependabot PRs do not receive repository signing secrets. Keep analysis/tests
      # running above, but never require or expose production signing credentials there.
      - name: Configure Android signing for CI artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF2
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF2

      - name: Build signed APK
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: flutter build apk --release

      - name: Build signed AAB
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: flutter build appbundle --release

      - name: Verify Android signatures
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/trinex-aab-signature.txt
          grep -q 'jar verified' /tmp/trinex-aab-signature.txt

      - name: Prepare compressed CI artifacts
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          mkdir -p build/ci-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "build/ci-artifacts/TRINEX.apk"
          cp build/app/outputs/bundle/release/app-release.aab "build/ci-artifacts/TRINEX.aab"
          cd build/ci-artifacts
          zip -9 -q "TRINEX APK.zip" TRINEX.apk
          zip -9 -q "TRINEX AAB.zip" TRINEX.aab
          unzip -t "TRINEX APK.zip"
          unzip -t "TRINEX AAB.zip"

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage-${{ github.sha }}
          path: apps/student/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload signed APK zip
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: TRINEX APK.zip
          path: apps/student/build/ci-artifacts/TRINEX APK.zip
          if-no-files-found: error

      - name: Upload signed AAB zip
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: TRINEX AAB.zip
          path: apps/student/build/ci-artifacts/TRINEX AAB.zip
          if-no-files-found: error

  backend:
    name: Backend Validate & Deploy
    needs: changes
    if: needs.changes.outputs.backend == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Contract & security checks
        working-directory: .
        run: |
          python3 ci/backend_schema_check.py
          python3 ci/push_dispatch_check.py
          python3 ci/backend_schema_audit.py
          python3 ci/backend_api_integrity_check.py
          python3 ci/backend_api_contract_check.py
          python3 ci/admin_app_contract_check.py
          node ci/marketplace_check.mjs
          python3 ci/admin_crud_check.py
          python3 ci/auth_hardening_check.py
          python3 ci/eino_provider_check.py
          python3 ci/eino_monitor_check.py
          python3 ci/eino_observability_check.py
          python3 ci/drive_library_reconciliation_check.py
          python3 ci/study_tutorial_trigger_check.py
          python3 ci/eino_orb_motion_check.py
          python3 ci/exam_bulk_upload_check.py
          node ci/eino_provider_matrix_check.mjs
          node ci/eino_upload_queue_integration_test.mjs
          node ci/eino_pdf_pipeline_integration_test.mjs
          node ci/eino_drive_d1_sync_integration_test.mjs

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Deploy backend on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_deploy == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_APPS_SCRIPT_DRIVE_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_DRIVE_URL }}
          GOOGLE_APPS_SCRIPT_GMAIL_URL: ${{ secrets.GOOGLE_APPS_SCRIPT_GMAIL_URL }}
          GOOGLE_APPS_SCRIPT_DRIVE_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_DRIVE_TOKEN }}
          GOOGLE_APPS_SCRIPT_GMAIL_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_GMAIL_TOKEN }}
          FREE_AI_API_KEY: ${{ secrets.FREE_AI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREE_AI_BASE_URL: ${{ secrets.FREE_AI_BASE_URL }}
          EINO_EMBEDDING_API_KEY: ${{ secrets.EINO_EMBEDDING_API_KEY }}
          STAFF_BOOTSTRAP_TOKEN: ${{ secrets.STAFF_BOOTSTRAP_TOKEN }}
          CF_ANALYTICS_API_TOKEN: ${{ secrets.CF_ANALYTICS_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GOOGLE_APPS_SCRIPT_DRIVE_URL"
          test -n "$GOOGLE_APPS_SCRIPT_GMAIL_URL"
          test -n "$GOOGLE_APPS_SCRIPT_DRIVE_TOKEN"
          test -n "$GOOGLE_APPS_SCRIPT_GMAIL_TOKEN"

          npx wrangler d1 migrations apply leo-association-db --remote

          for pair in \
            FREE_AI_API_KEY \
            MISTRAL_API_KEY \
            GROQ_API_KEY \
            FREE_AI_BASE_URL \
            EINO_EMBEDDING_API_KEY \
            GOOGLE_APPS_SCRIPT_DRIVE_TOKEN \
            GOOGLE_APPS_SCRIPT_GMAIL_TOKEN \
            STAFF_BOOTSTRAP_TOKEN \
            CF_ANALYTICS_API_TOKEN; do
            value="${!pair:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$pair"
            fi
          done
          # Account ID only scopes the optional analytics query; never pass the deploy token to runtime.
          printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | npx wrangler secret put CF_ANALYTICS_ACCOUNT_ID

          npx wrangler deploy \
            --var "GOOGLE_APPS_SCRIPT_DRIVE_URL:$GOOGLE_APPS_SCRIPT_DRIVE_URL" \
            --var "GOOGLE_APPS_SCRIPT_GMAIL_URL:$GOOGLE_APPS_SCRIPT_GMAIL_URL"

      - name: Verify production API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend_deploy == 'true'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://leo-association-api.www-halaahlalkher7.workers.dev' }}
        run: |
          set -euo pipefail
          HEALTH_URL="${API_BASE_URL%/}/api/v1/health"
          echo "Verifying production API: $HEALTH_URL"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$HEALTH_URL"

  website:
    name: Website Build & Deploy
    needs: changes
    if: needs.changes.outputs.website == 'true' || needs.changes.outputs.shared == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund

      - name: Build distribution
        run: npm run build

      - name: Web security and native admin contract checks
        run: |
          python3 ci/web_security_check.py
          python3 ci/xss_dom_check.py
          python3 ci/admin_app_contract_check.py

      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Deploy website on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.website_deploy == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /ush-eng.great-site.net/htdocs/
          dangerous-clean-slate: false

      - name: Verify production website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.website_deploy == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL || 'https://ush-eng.great-site.net' }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL" || { echo 'SITE_URL is empty'; exit 1; }
          # InfinityFree may reject generic curl requests with an empty reply.
          # Send a browser-like request and keep the response body for diagnostics.
          curl --fail --silent --show-error --location \
            --retry 5 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 60 \
            -A "Mozilla/5.0 (Linux; Android 15) AppleWebKit/537.36 Chrome/140.0 Safari/537.36" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: en-US,en;q=0.9" \
            -o /tmp/site-health.html \
            -w "HTTP status: %{http_code}\n" \
            "$SITE_URL/"
          test -s /tmp/site-health.html || { echo 'Website returned an empty body'; exit 1; }
          echo 'Website health check passed.' 
