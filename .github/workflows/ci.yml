name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      website: ${{ steps.filter.outputs.website }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed areas
        id: filter
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            flutter=true
            website=true
            backend=true
          else
            if [[ "$EVENT_NAME" == "pull_request" ]]; then
              base="$BASE_SHA"
            else
              base="$BEFORE_SHA"
              if [[ -z "$base" || "$base" =~ ^0+$ ]]; then
                base="$(git rev-list --max-count=1 HEAD^)"
              fi
            fi

            changed="$(git diff --name-only "$base" "$HEAD_SHA")"
            echo "Changed files:"
            printf '%s\n' "$changed"

            flutter=false
            website=false
            backend=false

            while IFS= read -r file; do
              [[ -z "$file" ]] && continue
              case "$file" in
                flutter/*|ci/flutter_secure_storage_check.py|ci/offline_cache_check.py|ci/color_theme_check.py|ci/release_check.py|ci/final_release_check.py)
                  flutter=true
                  ;;
                website/*|build.js|package.json|package-lock.json|ci/web_security_check.py|ci/xss_dom_check.py|ci/admin_ui_payload_check.py)
                  website=true
                  ;;
                backend/*|ci/backend_schema_check.py|ci/backend_schema_audit.py|ci/backend_api_integrity_check.py|ci/backend_api_contract_check.py|ci/admin_crud_check.py|ci/auth_hardening_check.py|ci/eino_provider_check.py|ci/eino_dashboard_check.py|ci/eino_observability_check.py|ci/eino_provider_matrix_check.mjs)
                  backend=true
                  ;;
              esac
            done <<< "$changed"
          fi

          echo "flutter=$flutter" >> "$GITHUB_OUTPUT"
          echo "website=$website" >> "$GITHUB_OUTPUT"
          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "Flutter: $flutter | Website: $website | Backend: $backend"

  flutter:
    name: Flutter Analyze, Test & Signed Artifacts
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --coverage

      - name: Project verification
        working-directory: .
        run: python3 ci/verify_project.py

      - name: Workflow consistency
        working-directory: .
        run: python3 ci/workflow_consistency_check.py

      - name: Flutter release-safety checks
        working-directory: .
        run: |
          python3 ci/release_check.py
          python3 ci/final_release_check.py
          python3 ci/flutter_secure_storage_check.py
          python3 ci/offline_cache_check.py
          python3 ci/color_theme_check.py

      - name: Configure Android signing for CI artifacts
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            test -n "${!name}" || { echo "Missing $name"; exit 1; }
          done
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF2
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF2

      - name: Build signed APK
        run: flutter build apk --release

      - name: Build signed AAB
        run: flutter build appbundle --release

      - name: Verify Android signatures
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          APKSIGNER="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -1)/apksigner"
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          jarsigner -verify -verbose -certs "$AAB" >/tmp/trinex-aab-signature.txt
          grep -q 'jar verified' /tmp/trinex-aab-signature.txt

      - name: Prepare compressed CI artifacts
        run: |
          set -euo pipefail
          mkdir -p build/ci-artifacts
          cp build/app/outputs/flutter-apk/app-release.apk "build/ci-artifacts/TRINEX.apk"
          cp build/app/outputs/bundle/release/app-release.aab "build/ci-artifacts/TRINEX.aab"
          cd build/ci-artifacts
          zip -9 -q "TRINEX APK.zip" TRINEX.apk
          zip -9 -q "TRINEX AAB.zip" TRINEX.aab
          unzip -t "TRINEX APK.zip"
          unzip -t "TRINEX AAB.zip"

      - name: Upload Flutter coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage-${{ github.sha }}
          path: flutter/coverage/lcov.info
          if-no-files-found: ignore

      - name: Upload signed APK zip
        uses: actions/upload-artifact@v7
        with:
          name: TRINEX APK.zip
          path: flutter/build/ci-artifacts/TRINEX APK.zip
          if-no-files-found: error

      - name: Upload signed AAB zip
        uses: actions/upload-artifact@v7
        with:
          name: TRINEX AAB.zip
          path: flutter/build/ci-artifacts/TRINEX AAB.zip
          if-no-files-found: error

  backend:
    name: Backend Validate & Deploy
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Syntax check
        run: npm run check

      - name: Contract & security checks
        working-directory: .
        run: |
          python3 ci/backend_schema_check.py
          python3 ci/backend_schema_audit.py
          python3 ci/backend_api_integrity_check.py
          python3 ci/backend_api_contract_check.py
          python3 ci/admin_crud_check.py
          python3 ci/auth_hardening_check.py
          python3 ci/eino_provider_check.py
          python3 ci/eino_dashboard_check.py
          python3 ci/eino_observability_check.py
          node ci/eino_provider_matrix_check.mjs

      - name: Wrangler dry run
        run: npx wrangler deploy --dry-run

      - name: Deploy backend on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
          FREE_AI_API_KEY: ${{ secrets.FREE_AI_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          FREE_AI_BASE_URL: ${{ secrets.FREE_AI_BASE_URL }}
          EINO_EMBEDDING_API_KEY: ${{ secrets.EINO_EMBEDDING_API_KEY }}
          STAFF_BOOTSTRAP_TOKEN: ${{ secrets.STAFF_BOOTSTRAP_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$GOOGLE_APPS_SCRIPT_TOKEN"

          npx wrangler d1 migrations apply leo-association-db --remote

          for pair in \
            FREE_AI_API_KEY \
            MISTRAL_API_KEY \
            GROQ_API_KEY \
            FREE_AI_BASE_URL \
            EINO_EMBEDDING_API_KEY \
            GOOGLE_APPS_SCRIPT_TOKEN \
            STAFF_BOOTSTRAP_TOKEN; do
            value="${!pair:-}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$pair"
            fi
          done

          npx wrangler deploy

      - name: Verify production API
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'https://leo-association-api.www-halaahlalkher7.workers.dev' }}
        run: |
          set -euo pipefail
          HEALTH_URL="${API_BASE_URL%/}/api/v1/health"
          echo "Verifying production API: $HEALTH_URL"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$HEALTH_URL"

  website:
    name: Website Build & Deploy
    needs: changes
    if: needs.changes.outputs.website == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build distribution
        run: npm run build

      - name: Web security checks
        run: |
          python3 ci/web_security_check.py
          python3 ci/xss_dom_check.py
          python3 ci/admin_ui_payload_check.py

      - name: Upload website artifact
        uses: actions/upload-artifact@v7
        with:
          name: website-dist-${{ github.sha }}
          path: dist/
          if-no-files-found: error

      - name: Deploy website on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /ush-eng.great-site.net/htdocs/
          dangerous-clean-slate: false

      - name: Verify production website
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          set -euo pipefail
          test -n "$SITE_URL" || { echo 'SITE_URL production variable is required'; exit 1; }
          curl --fail --silent --show-error --retry 5 --retry-delay 3 "$SITE_URL/"
