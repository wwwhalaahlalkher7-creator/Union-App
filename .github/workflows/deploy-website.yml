name: Deploy TRINEX Website (Public Site + /admin)

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: trinex-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate complete website
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate website Worker
        run: node --check website/worker/index.js

      - name: Validate dashboard Worker
        run: node --check website/dashboard/worker/index.js

      - name: Validate JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find website -type f -name '*.js' \
            ! -path 'website/worker/index.js' -print0)

      - name: Validate required public website files
        shell: bash
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/news.html
          test -f website/activities.html
          test -f website/Injazat.html
          test -f website/courses.html
          test -f website/committees.html
          test -f website/site-settings.js
          test -f website/ui-pro.css
          test -f website/ui-pro.js
          test -f website/robots.txt
          test -f website/sitemap.xml

      - name: Validate required dashboard files
        shell: bash
        run: |
          set -euo pipefail
          test -f website/dashboard/index.html
          test -f website/dashboard/login.html
          test -f website/dashboard/config.js
          test -f website/dashboard/worker/index.js
          test -f website/dashboard/assets/trinex_icon.png

      - name: Reject legacy public-site dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'script\.google\.com|googleusercontent|Airtable|Apps Script|ad-manager\.js|analytics-tracker\.js|SUGGESTIONS_APPS_SCRIPT_URL|data-ad-placement|action=like|action=view|liked_(news|activities|achievements)_ids' website \
            --exclude-dir=dashboard --exclude='README*' --exclude='UI_PRO_CHANGELOG.md'; then
            echo 'Legacy public-site dependency detected.'
            exit 1
          fi

  deploy:
    name: Deploy complete website to Cloudflare
    needs: validate
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare complete website assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf website/dist
          mkdir -p website/dist

          # Public website stays at the root.
          rsync -a website/ website/dist/ \
            --exclude='dist/' \
            --exclude='dashboard/' \
            --exclude='worker/' \
            --exclude='wrangler.toml' \
            --exclude='README*.md' \
            --exclude='UI_PRO_CHANGELOG.md'

          # Dashboard is part of the same deployed website under /admin/.
          mkdir -p website/dist/admin
          rsync -a website/dashboard/ website/dist/admin/ \
            --exclude='public/' \
            --exclude='worker/' \
            --exclude='wrangler.toml' \
            --exclude='README*.md'

          test -f website/dist/index.html
          test -f website/dist/admin/index.html

      - name: Deploy complete website
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.86.0 deploy
