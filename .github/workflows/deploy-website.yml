name: Website CI / InfinityFree Deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: trinex-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and package site + dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find website -type f -name '*.js' ! -path 'website/worker/*' ! -path 'website/dashboard/worker/*' -print0)

      - name: Validate required public website files
        shell: bash
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/news.html
          test -f website/activities.html
          test -f website/Injazat.html
          test -f website/courses.html
          test -f website/committees.html
          test -f website/site-settings.js
          test -f website/ui-pro.css
          test -f website/ui-pro.js
          test -f website/robots.txt
          test -f website/sitemap.xml

      - name: Validate required dashboard files
        shell: bash
        run: |
          set -euo pipefail
          test -f website/dashboard/index.html
          test -f website/dashboard/login.html
          test -f website/dashboard/config.js
          test -f website/dashboard/assets/trinex_icon.png

      - name: Reject legacy public-site dependencies
        shell: bash
        run: |
          set -euo pipefail
          if grep -RniE 'script\.google\.com|googleusercontent|Airtable|Apps Script|ad-manager\.js|analytics-tracker\.js|SUGGESTIONS_APPS_SCRIPT_URL|data-ad-placement|action=like|action=view|liked_(news|activities|achievements)_ids' website \
            --exclude-dir=dashboard --exclude-dir=worker --exclude='README*'; then
            echo 'Legacy public-site dependency detected.'
            exit 1
          fi

      - name: Prepare InfinityFree package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf infinityfree-dist
          mkdir -p infinityfree-dist/admin

          rsync -a website/ infinityfree-dist/ \
            --exclude='dashboard/' \
            --exclude='worker/' \
            --exclude='wrangler.toml' \
            --exclude='README*.md' \
            \
           

          rsync -a website/dashboard/ infinityfree-dist/admin/ \
            --exclude='worker/' \
            --exclude='wrangler.toml' \
            --exclude='README*.md'

          test -f infinityfree-dist/index.html
          test -f infinityfree-dist/admin/index.html

      - name: Create InfinityFree ZIP
        run: |
          cd infinityfree-dist
          zip -qr ../TRINEX-InfinityFree-site-dashboard.zip .

      - name: Upload InfinityFree package
        uses: actions/upload-artifact@v4
        with:
          name: TRINEX-InfinityFree-site-dashboard
          path: TRINEX-InfinityFree-site-dashboard.zip
          if-no-files-found: error

  deploy-to-infinityfree:
    name: Deploy to InfinityFree via FTPS
    needs: validate-and-package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate deployment secrets
        shell: bash
        env:
          INFINITYFREE_FTP_USERNAME: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          INFINITYFREE_FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          INFINITYFREE_FTP_REMOTE_DIR: ${{ secrets.INFINITYFREE_FTP_REMOTE_DIR }}
        run: |
          set -euo pipefail
          test -n "$INFINITYFREE_FTP_USERNAME" || { echo 'Missing INFINITYFREE_FTP_USERNAME repository secret.'; exit 1; }
          test -n "$INFINITYFREE_FTP_PASSWORD" || { echo 'Missing INFINITYFREE_FTP_PASSWORD repository secret.'; exit 1; }
          if [ -z "$INFINITYFREE_FTP_REMOTE_DIR" ]; then
            echo 'INFINITYFREE_FTP_REMOTE_DIR is not set; using htdocs/.'
          fi

      - name: Prepare InfinityFree deployment directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf infinityfree-dist
          mkdir -p infinityfree-dist/admin

          rsync -a website/ infinityfree-dist/ \
            --exclude='dashboard/' \
            --exclude='worker/' \
            --exclude='wrangler.toml' \
            --exclude='README*.md' \
            \
           

          rsync -a website/dashboard/ infinityfree-dist/admin/ \
            --exclude='worker/' \
            --exclude='wrangler.toml' \
            --exclude='README*.md'

      - name: Deploy site + dashboard to InfinityFree
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./infinityfree-dist/
          server-dir: ${{ secrets.INFINITYFREE_FTP_REMOTE_DIR || 'htdocs/' }}
          log-level: minimal
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**

      - name: Deployment summary
        run: |
          echo 'InfinityFree deployment completed.'
          echo 'Public site: https://ush-eng.great-site.net/'
          echo 'Dashboard:   https://ush-eng.great-site.net/admin/'
