name: Website CI / InfinityFree Deploy

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/deploy-website.yml'
  workflow_dispatch:

concurrency:
  group: trinex-website-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate site + dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find website -type f -name '*.js' ! -path 'website/worker/*' ! -path 'website/dashboard/worker/*' -print0)
      - name: Validate required files
        shell: bash
        run: |
          set -euo pipefail
          test -f website/index.html
          test -f website/courses.html
          test -f website/dashboard/index.html
          test -f website/dashboard/login.html
          test -f website/dashboard/config.js
          test -f website/dashboard/assets/trinex_icon.png
      - name: Prepare deployment payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf infinityfree-dist
          mkdir -p infinityfree-dist/admin
          rsync -a website/ infinityfree-dist/ --exclude='dashboard/' --exclude='worker/' --exclude='wrangler.toml' --exclude='README*.md'
          rsync -a website/dashboard/ infinityfree-dist/admin/ --exclude='worker/' --exclude='wrangler.toml' --exclude='README*.md'
          test -f infinityfree-dist/index.html
          test -f infinityfree-dist/admin/index.html
          grep -Fx 'TRINEX deploy V2.0.1-crud-drive-v7' infinityfree-dist/deploy-version.txt
          grep -Fx 'TRINEX dashboard deploy V2.0.1-crud-drive-v7' infinityfree-dist/admin/deploy-version.txt
      - name: Deployment payload summary
        shell: bash
        run: |
          echo "Files: $(find infinityfree-dist -type f | wc -l)"
          du -sh infinityfree-dist

  deploy-to-infinityfree:
    name: Deploy to InfinityFree via FTPS
    needs: validate-and-package
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare deployment directory
        shell: bash
        run: |
          set -euo pipefail
          rm -rf infinityfree-dist
          mkdir -p infinityfree-dist/admin
          rsync -a website/ infinityfree-dist/ --exclude='dashboard/' --exclude='worker/' --exclude='wrangler.toml' --exclude='README*.md'
          rsync -a website/dashboard/ infinityfree-dist/admin/ --exclude='worker/' --exclude='wrangler.toml' --exclude='README*.md'
      - name: Deploy site + dashboard to the real document root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./infinityfree-dist/
          server-dir: ush-eng.great-site.net/htdocs/
          log-level: verbose
          dangerously-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**
            **/.DS_Store
            **/node_modules/**
      - name: Deployment summary
        run: |
          echo 'InfinityFree deployment completed.'
          echo 'Target: ush-eng.great-site.net/htdocs/'
          echo 'Public site: https://ush-eng.great-site.net/'
          echo 'Dashboard:   https://ush-eng.great-site.net/admin/'
