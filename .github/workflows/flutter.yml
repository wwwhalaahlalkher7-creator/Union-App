name: Flutter CI

on:
  push:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter/**'
      - '.github/workflows/flutter.yml'

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter-checks:
    name: Flutter analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Flutter version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(cat VERSION)"
          grep -q "version: ${VERSION}" pubspec.yaml
          SEMVER="${VERSION%%+*}"
          BUILD="${VERSION##*+}"
          grep -q "static const name = '${SEMVER}';" lib/core/app_version.dart
          grep -q "static const build = ${BUILD};" lib/core/app_version.dart
          echo "Flutter version metadata OK: ${VERSION}"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    name: Android release artifacts
    needs: flutter-checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.2'
          channel: stable
          cache: true

      - name: Setup Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Get dependencies
        run: flutter pub get

      - name: Ensure Android Gradle Wrapper
        shell: bash
        run: |
          set -euo pipefail
          cd android
          if [ ! -f gradlew ] || [ ! -f gradle/wrapper/gradle-wrapper.properties ] || [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.14 --distribution-type bin
          fi
          test -x gradlew
          test -f gradle/wrapper/gradle-wrapper.properties
          test -f gradle/wrapper/gradle-wrapper.jar
          grep -q 'gradle-8\.14-' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version

      - name: Configure production signing
        if: github.ref == 'refs/heads/main'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANDROID_KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 secret is required on main}"
          : "${ANDROID_KEY_ALIAS:?ANDROID_KEY_ALIAS secret is required on main}"
          : "${ANDROID_KEY_PASSWORD:?ANDROID_KEY_PASSWORD secret is required on main}"
          : "${ANDROID_STORE_PASSWORD:?ANDROID_STORE_PASSWORD secret is required on main}"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          test -s android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=${ANDROID_STORE_PASSWORD}
          keyPassword=${ANDROID_KEY_PASSWORD}
          keyAlias=${ANDROID_KEY_ALIAS}
          storeFile=upload-keystore.jks
          EOF
          chmod 600 android/key.properties android/upload-keystore.jks

      - name: Build APK
        run: flutter build apk --release

      - name: Build AAB
        run: flutter build appbundle --release

      - name: Verify production signing on main
        if: github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          test -s android/key.properties
          test -s android/upload-keystore.jks

      - name: Remove signing material
        if: always()
        shell: bash
        run: |
          rm -f android/key.properties android/upload-keystore.jks

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: leo-association-apk
          path: flutter/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: leo-association-aab
          path: flutter/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
