name: CI/CD Pipeline - App, Backend & Website

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Build & Validate Flutter Mobile Application (APK & AAB)
  # -------------------------------------------------------------
  flutter-build:
    name: Build Flutter Application
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Java JDK (Java 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Version
        run: flutter --version

      - name: Install Dependencies
        run: flutter pub get

      - name: Static Code Analysis (Lint)
        run: flutter analyze --no-fatal-infos

      - name: Run Unit & Integration Tests
        run: flutter test

      - name: Configure Android Signing Keystore (Optional for Release)
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/upload-keystore.jks
          cat <<EOF > android/key.properties
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          storeFile=upload-keystore.jks
          EOF

      # Build and publish the APK first. The AAB build starts only after
      # this upload completes, so a usable APK artifact is available even
      # if the later AAB build fails.
      - name: Build Android APK
        run: flutter build apk --release

      - name: Package APK as ZIP
        run: |
          cd build/app/outputs/flutter-apk
          zip -j app-release-apk.zip app-release.apk

      - name: Upload APK ZIP
        uses: actions/upload-artifact@v4
        with:
          name: trinex-android-apk
          path: flutter/build/app/outputs/flutter-apk/app-release-apk.zip
          if-no-files-found: error

      # Only after the APK ZIP has been uploaded do we start the AAB build.
      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Package AAB as ZIP
        run: |
          cd build/app/outputs/bundle/release
          zip -j app-release-aab.zip app-release.aab

      - name: Upload AAB ZIP
        uses: actions/upload-artifact@v4
        with:
          name: trinex-android-aab
          path: flutter/build/app/outputs/bundle/release/app-release-aab.zip
          if-no-files-found: error

  # -------------------------------------------------------------
  # Job 2: Test & Deploy Backend to Cloudflare Workers & D1
  # -------------------------------------------------------------
  backend-deploy:
    name: Deploy Backend (Cloudflare Worker & D1)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Backend Dependencies
        run: npm install --no-audit --no-fund

      - name: Validate Syntax (Node Check)
        run: node --check src/index.js

      - name: Validate D1 Schema & Backend Hardening
        run: |
          python3 ../ci/backend_schema_check.py
          python3 ../ci/backend_schema_audit.py
          python3 ../ci/backend_api_integrity_check.py
          python3 ../ci/backend_api_contract_check.py

      - name: Apply D1 Database Migrations (Production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler d1 migrations apply leo-association-db --remote

      - name: Configure Backend Production Secrets
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ -n "${{ secrets.FREE_AI_API_KEY }}" ]; then
            echo "${{ secrets.FREE_AI_API_KEY }}" | npx wrangler secret put FREE_AI_API_KEY
          fi
          if [ -n "${{ secrets.FREE_AI_BASE_URL }}" ]; then
            echo "${{ secrets.FREE_AI_BASE_URL }}" | npx wrangler secret put FREE_AI_BASE_URL
          fi
          if [ -z "${{ secrets.OMNIROUTE_API_KEY }}" ]; then
            echo "::error::OMNIROUTE_API_KEY is required for the configured OmniRoute Eino gateway. Create a gateway API key in OmniRoute → API Keys and add it to GitHub Secrets."
            exit 1
          fi
          echo "${{ secrets.OMNIROUTE_API_KEY }}" | npx wrangler secret put OMNIROUTE_API_KEY
          if [ -n "${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}" ]; then
            echo "${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}" | npx wrangler secret put GOOGLE_APPS_SCRIPT_TOKEN
          fi
          if [ -n "${{ secrets.STAFF_BOOTSTRAP_TOKEN }}" ]; then
            echo "${{ secrets.STAFF_BOOTSTRAP_TOKEN }}" | npx wrangler secret put STAFF_BOOTSTRAP_TOKEN
          fi

      - name: Verify OmniRoute Gateway Before Worker Deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: https://omnirouteopen-sse-production.up.railway.app/v1
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ -z "$OMNIROUTE_API_KEY" ]; then
            echo "::error::OMNIROUTE_API_KEY is missing."
            exit 1
          fi
          status=$(curl -sS -o /tmp/omniroute-models.json -w "%{http_code}" \
            -H "Authorization: Bearer $OMNIROUTE_API_KEY" \
            -H "Accept: application/json" \
            "$OMNIROUTE_BASE_URL/models")
          echo "OmniRoute /v1/models HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::OmniRoute rejected the gateway key or is unavailable. HTTP $status"
            cat /tmp/omniroute-models.json
            exit 1
          fi
          python3 - <<'PY2'
          import json
          from pathlib import Path
          p=Path('/tmp/omniroute-models.json')
          data=json.loads(p.read_text())
          models=data.get('data', []) if isinstance(data, dict) else []
          print(f'OmniRoute models visible: {len(models)}')
          if not models:
              raise SystemExit('::error::OmniRoute is reachable but exposes no models. Add/enable at least one provider/model in OmniRoute.')
          blocked=('embedding','embed','image','audio','tts','stt','vision')
          selected=''
          for item in models:
              model=str(item.get('id','')).strip() if isinstance(item, dict) else ''
              if model and not any(x in model.lower() for x in blocked):
                  selected=model
                  break
          if not selected:
              raise SystemExit('::error::OmniRoute returned models, but no chat-capable model could be selected for the smoke test.')
          Path('/tmp/omniroute-chat-model.txt').write_text(selected)
          print(f'OmniRoute smoke-test model: {selected}')
          PY2

      - name: Smoke Test OmniRoute Chat
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          OMNIROUTE_API_KEY: ${{ secrets.OMNIROUTE_API_KEY }}
          OMNIROUTE_BASE_URL: https://omnirouteopen-sse-production.up.railway.app/v1
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          model=$(cat /tmp/omniroute-chat-model.txt)
          payload=$(python3 - "$model" <<'PY3'
          import json, sys
          print(json.dumps({
              'model': sys.argv[1],
              'messages': [{'role': 'user', 'content': 'Reply with exactly: PONG'}],
              'temperature': 0,
              'max_tokens': 8,
              'stream': False,
          }))
          PY3
          )
          status=$(curl -sS -o /tmp/omniroute-chat.json -w "%{http_code}" \
            -H "Authorization: Bearer $OMNIROUTE_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "$OMNIROUTE_BASE_URL/chat/completions")
          echo "OmniRoute /v1/chat/completions HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::OmniRoute is reachable, but a real chat completion failed. Check the selected provider/model, routing combo, and provider credentials."
            cat /tmp/omniroute-chat.json
            exit 1
          fi
          python3 - <<'PY4'
          import json
          from pathlib import Path
          data=json.loads(Path('/tmp/omniroute-chat.json').read_text())
          content=data.get('choices',[{}])[0].get('message',{}).get('content','') if isinstance(data,dict) else ''
          if not str(content).strip():
              raise SystemExit('::error::OmniRoute returned HTTP 200 but no chat content.')
          print('OmniRoute chat smoke test passed.')
          PY4

      - name: Deploy Cloudflare Worker
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: npx wrangler deploy

      - name: Validate required Drive adapter secret
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        env:
          GOOGLE_APPS_SCRIPT_TOKEN: ${{ secrets.GOOGLE_APPS_SCRIPT_TOKEN }}
          HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        run: |
          if [ -z "$GOOGLE_APPS_SCRIPT_TOKEN" ]; then
            echo "::error::GOOGLE_APPS_SCRIPT_TOKEN is required for Google Drive synchronization. Set it to the same API_TOKEN configured in Google Apps Script."
            exit 1
          fi


  # -------------------------------------------------------------
  # Job 3: Package & Deploy Public Website & Admin Dashboard
  # -------------------------------------------------------------
  website-deploy:
    name: Package & Deploy Website
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js (v24)
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Root Dependencies
        run: npm install --no-audit --no-fund

      - name: Package & Validate Distribution (dist/)
        run: node build.js

      - name: Upload Website Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trinex-website-dist
          path: dist/
          if-no-files-found: error

      - name: Deploy Website to Hosting via FTPS (InfinityFree) — mirror dist exactly
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && env.HAS_FTP == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        env:
          HAS_FTP: ${{ secrets.INFINITYFREE_FTP_USERNAME != '' && secrets.INFINITYFREE_FTP_PASSWORD != '' }}
        with:
          server: ftpupload.net
          username: ${{ secrets.INFINITYFREE_FTP_USERNAME }}
          password: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: /ush-eng.great-site.net/htdocs/
          dangerous-clean-slate: true
