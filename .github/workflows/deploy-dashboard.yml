name: Deploy TRINEX Dashboard (/admin)

on:
  push:
    branches: [main]
    paths:
      - 'website/dashboard/**'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

concurrency:
  group: trinex-dashboard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate dashboard
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate JavaScript
        shell: bash
        run: |
          set -euo pipefail
          node --check website/dashboard/worker/index.js
          while IFS= read -r -d '' file; do
            node --check "$file"
          done < <(find website/dashboard/js -type f -name '*.js' -print0)

      - name: Validate required dashboard files
        shell: bash
        run: |
          set -euo pipefail
          test -f website/dashboard/index.html
          test -f website/dashboard/login.html
          test -f website/dashboard/config.js
          test -f website/dashboard/wrangler.toml
          test -f website/dashboard/worker/index.js
          test -f website/dashboard/assets/trinex_icon.png

  deploy:
    name: Deploy to Cloudflare Workers
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Prepare /admin dashboard assets
        shell: bash
        run: |
          set -euo pipefail
          rm -rf website/dashboard/public
          mkdir -p website/dashboard/public
          rsync -a website/dashboard/ website/dashboard/public/ \
            --exclude='public/' \
            --exclude='worker/' \
            --exclude='wrangler.toml' \
            --exclude='README*.md'

      - name: Deploy dashboard
        working-directory: website/dashboard
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4.86.0 deploy
