name: Seed Student into D1

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  seed-student:
    name: Add student to Cloudflare D1
    runs-on: ubuntu-latest

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate required secrets
        env:
          STUDENT_NAME: ${{ secrets.SEED_STUDENT_NAME }}
          STUDENT_NUMBER: ${{ secrets.SEED_STUDENT_NUMBER }}
          STUDENT_DEPARTMENT: ${{ secrets.SEED_STUDENT_DEPARTMENT }}
        run: |
          set -e

          test -n "$CLOUDFLARE_API_TOKEN" || {
            echo "::error::CLOUDFLARE_API_TOKEN is missing"
            exit 1
          }

          test -n "$CLOUDFLARE_ACCOUNT_ID" || {
            echo "::error::CLOUDFLARE_ACCOUNT_ID is missing"
            exit 1
          }

          test -n "$STUDENT_NAME" || {
            echo "::error::SEED_STUDENT_NAME is missing"
            exit 1
          }

          test -n "$STUDENT_NUMBER" || {
            echo "::error::SEED_STUDENT_NUMBER is missing"
            exit 1
          }

          test -n "$STUDENT_DEPARTMENT" || {
            echo "::error::SEED_STUDENT_DEPARTMENT is missing"
            exit 1
          }

          echo "Required secrets are configured."

      - name: Prepare temporary SQL
        env:
          STUDENT_NAME: ${{ secrets.SEED_STUDENT_NAME }}
          STUDENT_NUMBER: ${{ secrets.SEED_STUDENT_NUMBER }}
          STUDENT_DEPARTMENT: ${{ secrets.SEED_STUDENT_DEPARTMENT }}
        run: |
          set -e

          node <<'NODE'
          const fs = require('fs');
          const path = require('path');

          const name = process.env.STUDENT_NAME;
          const number = process.env.STUDENT_NUMBER;
          const department = process.env.STUDENT_DEPARTMENT;

          function sql(value) {
            return "'" + String(value).replace(/'/g, "''") + "'";
          }

          const sqlFile = path.join(
            process.env.RUNNER_TEMP,
            'seed-student.sql'
          );

          const content = `
          PRAGMA foreign_keys = ON;

          INSERT INTO students (
            id,
            student_number,
            full_name,
            department_id,
            active
          )
          SELECT
            lower(hex(randomblob(16))),
            ${sql(number)},
            ${sql(name)},
            d.id,
            1
          FROM departments d
          WHERE d.active = 1
            AND (
              d.name_ar = ${sql(department)}
              OR d.name_en = ${sql(department)}
              OR d.code = ${sql(department)}
            )
            AND NOT EXISTS (
              SELECT 1
              FROM students s
              WHERE s.student_number = ${sql(number)}
            );

          SELECT
            s.id,
            s.student_number,
            s.full_name,
            d.name_ar AS department,
            s.active,
            CASE
              WHEN s.auth_secret_hash IS NULL
                THEN 'ready_for_registration'
              ELSE 'already_registered'
            END AS registration_state
          FROM students s
          JOIN departments d ON d.id = s.department_id
          WHERE s.student_number = ${sql(number)};
          `.trim() + '\n';

          fs.writeFileSync(sqlFile, content, 'utf8');

          console.log('Temporary SQL file prepared.');
          NODE

      - name: Apply student seed to D1
        working-directory: backend
        run: |
          npx --yes wrangler@4 d1 execute leo-association-db \
            --remote \
            --file "${RUNNER_TEMP}/seed-student.sql"

      - name: Cleanup temporary SQL
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/seed-student.sql"
