<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حسابي | لوحة تحكم الرابطة</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="config.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>

<style>
/* ============================================================
   ACCOUNT PREMIUM LAYER
   يحافظ على جميع IDs والـfunctions الحالية
   ============================================================ */

body[data-page="account"] {
  background:
    radial-gradient(circle at 92% 0%, rgba(46,128,199,.07), transparent 27rem),
    radial-gradient(circle at 5% 95%, rgba(14,58,99,.045), transparent 24rem),
    var(--canvas);
}

body[data-page="account"] .page-content {
  position: relative;
  padding-top: 30px;
}

body[data-page="account"] .page-content::before {
  content: "";
  position: fixed;
  inset: var(--topbar-h) 0 0;
  pointer-events: none;
  opacity: .3;
  background-image:
    linear-gradient(rgba(20,85,142,.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(20,85,142,.035) 1px, transparent 1px);
  background-size: 32px 32px;
  mask-image: linear-gradient(to bottom, black, transparent 88%);
  z-index: -1;
}

/* كل البطاقات */
body[data-page="account"] .card {
  border-radius: 18px;
  border-color: rgba(20,85,142,.13);
  box-shadow: 0 7px 24px rgba(16,24,38,.045);
}

body[data-page="account"] .card-header {
  min-height: 34px;
}

body[data-page="account"] .card-header h3 {
  font-size: .98rem;
  letter-spacing: -.01em;
}

body[data-page="account"] .card-header-hint {
  padding: 4px 9px;
  border-radius: 999px;
  background: var(--blueprint-100);
  color: var(--blueprint-700);
  transition: background .18s ease, transform .18s ease;
}

body[data-page="account"] .card-header-hint:hover {
  transform: translateY(-1px);
}

/* دخول الصفحة */
body[data-page="account"] #pageContent > * {
  animation: accountReveal .48s cubic-bezier(.2,.75,.3,1) both;
}

@keyframes accountReveal {
  from {
    opacity: 0;
    transform: translateY(9px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

/* الوضع الليلي */
@media (prefers-color-scheme: dark) {
  body[data-page="account"] {
    background:
      radial-gradient(circle at 92% 0%, rgba(46,128,199,.11), transparent 27rem),
      var(--canvas);
  }

  body[data-page="account"] .card,
  body[data-page="account"] .stat-card {
    border-color: rgba(148,163,184,.13);
    box-shadow: 0 9px 28px rgba(0,0,0,.20);
  }
  body[data-page="account"] .card-header-hint {
    background: rgba(46,128,199,.16);
  }
}

@media (max-width: 960px) {
  body[data-page="account"] .page-content {
    padding-top: 22px;
  }
}

@media (max-width: 560px) {
  body[data-page="account"] .page-content {
    padding: 14px;
  }

  body[data-page="account"] .stats-grid {
    gap: 10px;
  }

  body[data-page="account"] .card {
    border-radius: 15px;
    padding: 16px;
  }
}

@media (prefers-reduced-motion: reduce) {
  body[data-page="account"] #pageContent > * {
    animation: none;
  }
}
</style>

</head>
<body data-page="account">

<div id="app-shell"></div>

<template id="pageTemplate">
  <div class="card" style="margin-bottom:18px;max-width:420px">
    <div class="card-header">
      <h3>معلومات الحساب</h3>
    </div>
    <p style="font-size:.87rem;color:var(--ink-700);line-height:1.9;margin:0">
      <strong id="acctName">—</strong>
      <span style="color:var(--ink-500)"> · </span>
      <span id="acctRole" style="color:var(--ink-500)">—</span>
    </p>
  </div>

  <div class="card" style="max-width:420px">
    <div class="card-header">
      <h3>تغيير كلمة المرور</h3>
      <span class="card-header-hint">تُطبَّق على حسابك الحالي فقط</span>
    </div>

    <div class="login-feedback" id="pwFeedback"></div>

    <form id="pwForm" novalidate>
      <div class="field">
        <label for="oldPassword">كلمة المرور الحالية</label>
        <input type="password" id="oldPassword" name="oldPassword" autocomplete="current-password" required>
      </div>
      <div class="field">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <input type="password" id="newPassword" name="newPassword" autocomplete="new-password" minlength="8" required>
        <span class="field-hint">٨ أحرف على الأقل</span>
      </div>
      <div class="field">
        <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
        <input type="password" id="confirmPassword" name="confirmPassword" autocomplete="new-password" minlength="8" required>
      </div>
      <button type="submit" class="btn btn-primary" id="pwSubmitBtn">
        <i class="fa-solid fa-key"></i> تحديث كلمة المرور
      </button>
    </form>
  </div>
</template>

<script src="js/api-adapter.js?v=2.8.0"></script>
<script src="js/utils.js"></script>
<script src="js/feedback.js"></script>
<script src="js/modal.js"></script>
<script src="js/layout.js"></script>
<script>
  document.addEventListener("shell:ready", async () => {
    const tpl = document.getElementById("pageTemplate");
    document.getElementById("pageContent").appendChild(tpl.content.cloneNode(true));

    const session = (typeof Auth !== "undefined") ? Auth.get() : null;
    document.getElementById("acctName").textContent = (session && session.name) || "زائر";
    document.getElementById("acctRole").textContent = (session && session.role) || "غير محدد";

    document.getElementById("pwForm").addEventListener("submit", handlePasswordSubmit);
  });

  async function handlePasswordSubmit(e) {
    e.preventDefault();
    const feedback = document.getElementById("pwFeedback");
    const btn = document.getElementById("pwSubmitBtn");
    feedback.className = "login-feedback";
    feedback.textContent = "";

    const oldPassword = document.getElementById("oldPassword").value;
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
      feedback.className = "login-feedback is-error";
      feedback.textContent = "كلمة المرور الجديدة يجب ألا تقل عن 8 أحرف";
      return;
    }
    if (newPassword !== confirmPassword) {
      feedback.className = "login-feedback is-error";
      feedback.textContent = "كلمة المرور الجديدة وتأكيدها غير متطابقين";
      return;
    }

    // ⚠️ التحقق أعلاه محلي فقط (بلا طلب شبكة)؛ العملية الفعلية تمر
    // عبر Feedback.busy — مؤشر فوري على الزر + Toast إجباري عند الفشل
    // — ولا يُصفَّر النموذج إلا بعد نجاح الخادم فعلياً.
    try {
      await Feedback.busy(btn, () => Adapter.changePassword(oldPassword, newPassword), {
        busyLabel: "جارٍ التحديث...",
        successMessage: "تم تحديث كلمة المرور بنجاح",
        errorPrefix: "تعذّر تحديث كلمة المرور"
      });
    } catch (err) {
      feedback.className = "login-feedback is-error";
      feedback.textContent = err.message || "تعذّر تحديث كلمة المرور";
      return;
    }

    feedback.className = "login-feedback is-success";
    feedback.textContent = "تم تحديث كلمة المرور بنجاح.";
    document.getElementById("pwForm").reset();
  }
</script>
</body>
</html>
