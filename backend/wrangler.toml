name = "leo-association-api"
main = "src/index.js"
compatibility_date = "2026-09-10"

[vars]
APP_VERSION = "2.0.1"
MINIMUM_APP_VERSION = "2.0.0"
# Eino governance defaults. Override per environment without changing code.
EINO_STUDENT_DAILY_LIMIT = "100"
EINO_GUEST_DAILY_LIMIT = "20"
EINO_GLOBAL_DAILY_LIMIT = "2000"
APP_UPDATE_URL = ""
APP_RELEASE_NOTES = ""
API_VERSION = "v1"
# Optional self-hosted Chroma. Keep empty until a Chroma server is provisioned.
CHROMA_BASE_URL = ""
CHROMA_TENANT = ""
CHROMA_DATABASE = ""
CHROMA_COLLECTION_ID = ""
EINO_TEXT_MODEL = "auto"
EINO_MISTRAL_BASE_URL = "https://api.mistral.ai"
EINO_GROQ_BASE_URL = "https://api.groq.com/openai/v1"
EINO_MISTRAL_TEXT_MODEL = "mistral-small-2603"
EINO_MISTRAL_VISION_MODEL = "mistral-small-2603"
EINO_MISTRAL_OCR_MODEL = "mistral-ocr-latest"
EINO_MISTRAL_STT_MODEL = "voxtral-mini-2602"
EINO_MISTRAL_TTS_MODEL = "voxtral-mini-tts-2603"
EINO_GROQ_TEXT_MODEL = "openai/gpt-oss-120b"
EINO_GROQ_VISION_MODEL = "qwen/qwen3.8-27b"
EINO_GROQ_STT_MODEL = "whisper-large-v3-turbo"
EINO_GROQ_TTS_MODEL = "canopylabs/orpheus-arabic-saudi"
EINO_EMBEDDING_BASE_URL = ""
EINO_EMBEDDING_MODEL = ""
# Optional JSON model catalog. Keep empty to use the safe metadata-only fallback.
EINO_MODEL_CATALOG_JSON = ""
# Google Drive is accessed through the deployed Google Apps Script adapter.
GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwjpZhAnx3zWWrVB1nfS07UCBuHwm3nkBuip-kQ6ReO4n9RAPzbji5-H9RHmQqnloIEZw/exec"
# Browser clients allowed to call the API. Android/native clients do not use CORS.
ALLOWED_ORIGINS = "https://ush-eng.great-site.net"

[[d1_databases]]
binding = "DB"
database_name = "leo-association-db"
database_id = "60081adf-6694-4254-9cca-6d6b5fe0022b"
migrations_dir = "migrations"

# Secrets are intentionally not stored in this file.
# Required Eino upstream credentials are supplied through Cloudflare/GitHub secrets.
# CHROMA_TOKEN is added only when Chroma authentication is enabled.

# Comma-separated production origins. Configure as a secret/var in deployment.
