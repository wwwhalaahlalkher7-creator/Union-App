name = "leo-association-api"
main = "src/index.js"
compatibility_date = "2026-09-10"

[ai]
binding = "AI"

[vars]
APP_VERSION = "2.0.2"
MINIMUM_APP_VERSION = "2.0.0"
# Eino governance defaults. Override per environment without changing code.
EINO_STUDENT_DAILY_LIMIT = "50"
EINO_GUEST_DAILY_LIMIT = "10"
EINO_GLOBAL_DAILY_LIMIT = "1000"
APP_UPDATE_URL = "https://ush-eng.great-site.net/download.html"
APP_RELEASE_NOTES = "TRINEX 2.0.2 — إصدار متكامل لمنصة رابطة كلية الهندسة والعمارة.\nتطبيق Android متكامل للطلاب يجمع المحتوى الأكاديمي والخدمات الجامعية والتفاعل والمساعدة الذكية في واجهة واحدة.\nتسجيل دخول وحساب طالب آمن، ملف شخصي، إعدادات الحساب، تغيير كلمة المرور واستعادتها عبر البريد الإلكتروني.\nالصفحة الرئيسية والتنقل الموحد، مع الأخبار والإنجازات والفعاليات والتفاصيل والوسائط والتعليقات والإشعارات.\nنظام المواد الدراسية المنظم حسب التخصص والفصل، مع دعم الملفات وفتح ملفات PDF والوصول إلى المواد السابقة المسموح بها.\nالجدول الدراسي، الأدوات الهندسية، محول الوحدات، حاسبة المعدل GPA، حاسبة المقاومات والمراجع الهندسية.\nالتفاعل الطلابي يشمل المفضلة، المحتوى الأخير، التقدم، XP، الشارات، والأحداث التعليمية.\nمساعد Eino الذكي مع اتصال آمن بالـAPI ودعم الأساس المحلي للنماذج عند توفرها، مع التعامل مع فشل الاتصال والبدائل بشكل آمن.\nوضع عدم الاتصال مع التخزين المؤقت الذكي للمحتوى المناسب، ومحاولة الاتصال بالشبكة أولاً قبل استخدام البيانات المخزنة.\nواجهات API وBackend مبنية على Cloudflare Workers وD1، مع تكامل منفصل للمواد عبر TRINEX Drive والبريد عبر TRINEX Gmail.\nموقع ويب عام ولوحة إدارة للمحتوى والإشعارات والتعليقات وإدارة الطلاب والصلاحيات، مع حماية من XSS وتعزيزات أمنية للمصادقة.\nبنية داخلية محسنة وقابلة للصيانة مع Dependency Injection، طبقات شبكة وبيانات واضحة، معالجة أخطاء موحدة ورسائل مناسبة للمستخدم.\nتحسينات واسعة على الاستقرار والأداء، التخزين الآمن للجلسات، التحقق من الاستجابات، تحديث الجلسات، وفصل مسؤوليات الواجهات والخدمات.\nهذه النسخة تمثل الحزمة الحالية الكاملة من تجربة الطالب إلى الموقع والـAPI ولوحة الإدارة والبنية التشغيلية."
API_VERSION = "v1"
# Optional self-hosted Chroma. Keep empty until a Chroma server is provisioned.
CHROMA_BASE_URL = ""
CHROMA_TENANT = ""
CHROMA_DATABASE = ""
CHROMA_COLLECTION_ID = ""
EINO_TEXT_MODEL = "auto"
EINO_MISTRAL_BASE_URL = "https://api.mistral.ai"
EINO_GROQ_BASE_URL = "https://api.groq.com/openai/v1"
EINO_GEMINI_BASE_URL = "https://generativelanguage.googleapis.com/v1beta"
EINO_GEMINI_TEXT_MODEL = "gemini-3.5-flash-lite"
EINO_GEMINI_VISION_MODEL = "gemini-3.5-flash-lite"
EINO_GEMINI_STT_MODEL = "gemini-3.5-transcribe"
EINO_GEMINI_TTS_MODEL = "gemini-3.8-flash-lite-tts"
EINO_MISTRAL_TEXT_MODEL = "mistral-small-2603"
EINO_MISTRAL_VISION_MODEL = "mistral-small-2603"
EINO_MISTRAL_OCR_MODEL = "mistral-ocr-latest"
EINO_MISTRAL_STT_MODEL = "voxtral-mini-2602"
EINO_MISTRAL_TTS_MODEL = "voxtral-mini-tts-2603"
# Optional saved Mistral voice ID. Leave empty unless a voice profile is configured.
EINO_MISTRAL_TTS_VOICE_ID = ""
EINO_GROQ_TEXT_MODEL = "openai/gpt-oss-120b"
EINO_GROQ_VISION_MODEL = "qwen/qwen3.8-27b"
EINO_GROQ_STT_MODEL = "whisper-large-v3-turbo"
EINO_GROQ_TTS_MODEL = "canopylabs/orpheus-arabic-saudi"
EINO_DEEPGRAM_STT_MODEL = "nova-3"
EINO_TAVILY_SEARCH_MODEL = "search"
EINO_EXA_SEARCH_MODEL = "search"
EINO_CLOUDFLARE_IMAGE_MODEL = "@cf/black-forest-labs/flux-1-schnell"
EINO_EMBEDDING_BASE_URL = ""
EINO_EMBEDDING_MODEL = ""
# Optional JSON model catalog. Keep empty to use the safe metadata-only fallback.
EINO_MODEL_CATALOG_JSON = ""
# Google Apps Script adapter URLs are injected at deploy time by GitHub Actions.
# They are intentionally not stored in this repository configuration.
# Browser clients allowed to call the API. Android/native clients do not use CORS.
ALLOWED_ORIGINS = "https://ush-eng.great-site.net"

[[d1_databases]]
binding = "DB"
database_name = "leo-association-db"
database_id = "60081adf-6694-4254-9cca-6d6b5fe0022b"
migrations_dir = "migrations"

# Secrets are intentionally not stored in this file.
# Production secrets are synchronized from GitHub Actions via `wrangler secret put`.
# GOOGLE_APPS_SCRIPT_DRIVE_TOKEN is a Worker secret; it must match TRINEX Drive -> API_TOKEN.
# GOOGLE_APPS_SCRIPT_GMAIL_TOKEN is a Worker secret; it must match TRINEX Gmail -> EMAIL_API_TOKEN.
# Drive and Gmail URLs are intentionally separate so one service cannot affect the other.
# Required Eino upstream credentials are supplied through Cloudflare/GitHub secrets.
# CHROMA_TOKEN is added only when Chroma authentication is enabled.

# Comma-separated production origins. Configure as a secret/var in deployment.

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "trinex-media"
