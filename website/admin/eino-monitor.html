<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مراقبة Eino | لوحة تحكم TRINEX</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><link rel="stylesheet" href="css/admin.css">
<script src="config.js"></script><script src="js/theme.js"></script><script src="js/auth.js"></script>
<style>
body[data-page="einoMonitor"] .card{border-radius:18px;border-color:rgba(20,85,142,.13);box-shadow:0 7px 24px rgba(16,24,38,.045)}
.eino-monitor-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.eino-monitor-grid .stat-card{min-height:118px}
.eino-two{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:18px}.eino-table-wrap{overflow:auto}.eino-table{width:100%;border-collapse:collapse;min-width:720px}.eino-table th,.eino-table td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}.eino-table th{font-size:.78rem;color:var(--muted);background:var(--surface-sunken)}.eino-table td{font-size:.84rem}.eino-toolbar{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-bottom:14px}.eino-toolbar select{min-width:120px}.eino-privacy{display:flex;gap:8px;flex-wrap:wrap}.eino-privacy span{padding:6px 9px;border-radius:999px;background:var(--surface-sunken);font-size:.76rem;color:var(--muted)}
@media(max-width:900px){.eino-monitor-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.eino-two{grid-template-columns:1fr}}
@media(max-width:560px){.eino-monitor-grid{grid-template-columns:1fr 1fr}.eino-monitor-grid .stat-card{min-height:105px}.eino-toolbar{align-items:stretch;flex-direction:column}}
</style></head>
<body data-page="einoMonitor"><div id="app-shell"></div><template id="pageTemplate">
<section class="dashboard-hero"><div class="dashboard-hero-copy"><h2>مراقبة Eino</h2><p>مراقبة تشغيلية فعلية للمزودات والطلبات والحصص والأخطاء، بدون تخزين نصوص الطلاب داخل سجل المراقبة.</p></div><div class="dashboard-hero-actions"><button class="btn btn-secondary" id="refreshBtn"><i class="fa-solid fa-rotate"></i> تحديث</button></div></section>
<div class="card" style="margin-bottom:18px"><div class="card-header"><div><h3>حدود الخصوصية</h3><span class="card-header-hint">هذه الصفحة مخصصة لمدير النظام فقط</span></div></div><div class="eino-privacy"><span>لا تحفظ المحادثات هنا</span><span>لا تحفظ أرقام الطلاب</span><span>لا تحفظ عناوين IP</span><span>لا تحفظ محتوى الملفات</span><span>سجل تشغيلي 14 يومًا</span></div></div>
<div class="eino-monitor-grid"><div class="stat-card"><div class="stat-card-icon"><i class="fa-solid fa-paper-plane"></i></div><div class="stat-card-label">الطلبات</div><div class="stat-card-value" id="requests">—</div></div><div class="stat-card"><div class="stat-card-icon"><i class="fa-solid fa-circle-check"></i></div><div class="stat-card-label">نسبة النجاح</div><div class="stat-card-value" id="successRate">—</div></div><div class="stat-card"><div class="stat-card-icon"><i class="fa-solid fa-stopwatch"></i></div><div class="stat-card-label">متوسط الاستجابة</div><div class="stat-card-value" id="latency">—</div></div><div class="stat-card"><div class="stat-card-icon"><i class="fa-solid fa-gauge-high"></i></div><div class="stat-card-label">الوحدات المستهلكة</div><div class="stat-card-value" id="units">—</div></div></div>
<div class="eino-two"><section class="card"><div class="card-header"><div><h3>المزودات</h3><span class="card-header-hint">نجاح، فشل، زمن، وحدات</span></div></div><div class="eino-table-wrap"><table class="eino-table"><thead><tr><th>المزود</th><th>طلبات</th><th>نجاح</th><th>فشل</th><th>زمن</th><th>وحدات</th></tr></thead><tbody id="providers"></tbody></table></div></section><section class="card"><div class="card-header"><div><h3>أنواع المهام</h3><span class="card-header-hint">ما الذي يستخدمه الطلاب فعليًا؟</span></div></div><div class="eino-table-wrap"><table class="eino-table"><thead><tr><th>المهمة</th><th>طلبات</th><th>نجاح</th><th>زمن</th><th>وحدات</th></tr></thead><tbody id="tasks"></tbody></table></div></section></div>
<section class="card"><div class="card-header"><div><h3>آخر الطلبات</h3><span class="card-header-hint">بيانات تشغيلية فقط — بدون محتوى الطالب</span></div><div class="eino-toolbar"><select id="hours"><option value="6">6 ساعات</option><option value="24" selected>24 ساعة</option><option value="72">3 أيام</option><option value="168">7 أيام</option></select></div></div><div class="eino-table-wrap"><table class="eino-table"><thead><tr><th>الوقت</th><th>النوع</th><th>المهمة</th><th>الحالة</th><th>المزود</th><th>النموذج</th><th>الزمن</th><th>الوحدات</th><th>Fallback</th></tr></thead><tbody id="recent"></tbody></table></div></section>
</template><script src="js/api-adapter.js?v=3.0.2"></script><script src="js/utils.js"></script><script src="js/feedback.js"></script><script src="js/layout.js"></script><script>
document.addEventListener('shell:ready',async()=>{document.getElementById('pageContent').appendChild(document.getElementById('pageTemplate').content.cloneNode(true));document.getElementById('refreshBtn').addEventListener('click',load);document.getElementById('hours').addEventListener('change',load);await load();});
const esc=v=>Utils.escapeHtml(String(v??'—')); const num=v=>Utils.formatNumber(Number(v||0));
async function load(){try{const d=await Adapter.getEinoMonitor(Number(document.getElementById('hours')?.value||24),100);const summary=d.summary||[];const total=summary.reduce((n,x)=>n+Number(x.count||0),0);const success=summary.filter(x=>x.status==='success').reduce((n,x)=>n+Number(x.count||0),0);const units=summary.reduce((n,x)=>n+Number(x.costUnits||0),0);const weighted=summary.reduce((n,x)=>n+Number(x.count||0)*Number(x.avgLatencyMs||0),0);document.getElementById('requests').textContent=num(total);document.getElementById('successRate').textContent=total?Math.round(success*100/total)+'%':'—';document.getElementById('latency').textContent=total?num(Math.round(weighted/total))+' ms':'—';document.getElementById('units').textContent=num(units);document.getElementById('providers').innerHTML=(d.providers||[]).map(x=>`<tr><td><strong>${esc(x.provider)}</strong></td><td>${num(x.requests)}</td><td>${num(x.successes)}</td><td>${num(x.failures)}</td><td>${num(x.avgLatencyMs)} ms</td><td>${num(x.costUnits)}</td></tr>`).join('')||'<tr><td colspan="6">لا توجد بيانات.</td></tr>';document.getElementById('tasks').innerHTML=(d.tasks||[]).map(x=>`<tr><td><strong>${esc(x.task)}</strong></td><td>${num(x.requests)}</td><td>${num(x.successes)}</td><td>${num(x.avgLatencyMs)} ms</td><td>${num(x.costUnits)}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد بيانات.</td></tr>';document.getElementById('recent').innerHTML=(d.recent||[]).map(x=>`<tr><td>${esc(x.occurredAt)}</td><td>${esc(x.capability)}</td><td>${esc(x.task||'—')}</td><td>${esc(x.status)}</td><td>${esc(x.provider)}</td><td>${esc(x.model)}</td><td>${num(x.latencyMs)} ms</td><td>${num(x.costUnits)}</td><td>${x.fallback?'نعم':'لا'}</td></tr>`).join('')||'<tr><td colspan="9">لا توجد طلبات ضمن الفترة.</td></tr>';}catch(e){Feedback.error('تعذر تحميل مراقبة Eino.');}}
</script></body></html>
