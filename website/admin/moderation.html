<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الإشراف | لوحة تحكم TRINEX</title>
<link rel="stylesheet" href="css/admin.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<script src="config.js"></script><script src="js/theme.js"></script><script src="js/auth.js"></script>
</head>
<body data-page="moderation">
<div id="app-shell"></div>
<template id="pageTemplate">
  <section class="card" id="notificationsCard">
    <div class="card-header">
      <div><h3>التحكم بالإشعارات</h3><span class="card-header-hint">إنشاء الإشعارات وتعديلها وإرسالها للطلاب المستهدفين</span></div>
      <button type="button" class="btn btn-primary requires-edit" id="addNotificationBtn"><i class="fa-solid fa-plus"></i> إضافة إشعار</button>
    </div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>العنوان</th><th>النوع</th><th>الحالة</th><th>النشر</th><th>المستهدفون</th><th>المقروء</th><th></th></tr></thead><tbody id="notificationsBody"></tbody></table></div>
  </section>


  <section class="card" id="learningEventsCard" style="margin-top:18px">
    <div class="card-header">
      <div><h3>الأحداث</h3><span class="card-header-hint">أنشئ حدثًا بمكافأة XP وتصميم مختلف؛ عند النشر يُنشأ إشعار تلقائيًا للطلاب المستهدفين.</span></div>
      <button type="button" class="btn btn-primary requires-edit" id="addLearningEventBtn"><i class="fa-solid fa-plus"></i> إضافة حدث</button>
    </div>
    <div class="table-scroll"><table class="data-table"><thead><tr><th>اسم الحدث</th><th>التصميم</th><th>XP</th><th>الحالة</th><th>الإكمالات</th><th></th></tr></thead><tbody id="learningEventsBody"></tbody></table></div>
  </section>


  <section class="card" id="commentsCard" style="margin-top:18px">
    <div class="card-header"><div><h3>الإشراف على التعليقات</h3><span class="card-header-hint">استعرض التعليقات المرئية والمخفية والمحذوفة، وأعد إظهار ما تم إخفاؤه عند الحاجة.</span></div><button type="button" class="btn btn-secondary" id="moderationRefreshBtn"><i class="fa-solid fa-rotate"></i> تحديث</button></div>
    <div class="segmented-control" style="display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px">
      <button type="button" class="btn btn-secondary moderation-filter is-active" data-status="visible">مرئية</button>
      <button type="button" class="btn btn-secondary moderation-filter" data-status="hidden">مخفية</button>
      <button type="button" class="btn btn-secondary moderation-filter" data-status="deleted">محذوفة</button>
    </div>
    <div id="list"><div class="empty-state">جارٍ التحميل...</div></div>
  </section>

  <section class="card" id="repliesCard" style="margin-top:18px">
    <div class="card-header"><div><h3>الإشراف على الردود</h3><span class="card-header-hint">الردود لها دورة إشراف مستقلة عن التعليقات الأصلية.</span></div><button type="button" class="btn btn-secondary" id="repliesRefreshBtn"><i class="fa-solid fa-rotate"></i> تحديث</button></div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px">
      <button type="button" class="btn btn-secondary reply-filter is-active" data-status="visible">مرئية</button>
      <button type="button" class="btn btn-secondary reply-filter" data-status="hidden">مخفية</button>
      <button type="button" class="btn btn-secondary reply-filter" data-status="deleted">محذوفة</button>
    </div>
    <div id="repliesList"><div class="empty-state">جارٍ التحميل...</div></div>
  </section>
</template>
<script src="js/api-adapter.js?v=3.0.3"></script><script src="js/utils.js"></script><script src="js/feedback.js"></script><script src="js/modal.js"></script><script src="js/layout.js"></script>
<script>
let notificationRows=[];
let learningEventRows=[];
let moderationStatus='visible';
let moderationReplyStatus='visible';
const notificationSchema = Adapter.getContentSchema('announcements');

document.addEventListener('shell:ready',()=>{
  document.getElementById('pageContent').appendChild(document.getElementById('pageTemplate').content.cloneNode(true));
  document.getElementById('moderationRefreshBtn').addEventListener('click', loadModeration);
  document.getElementById('repliesRefreshBtn').addEventListener('click', loadModerationReplies);
  document.querySelectorAll('.reply-filter').forEach(btn=>btn.addEventListener('click',()=>{moderationReplyStatus=btn.dataset.status||'visible';document.querySelectorAll('.reply-filter').forEach(x=>x.classList.toggle('is-active',x===btn));loadModerationReplies();}));
  document.querySelectorAll('.moderation-filter').forEach(btn=>btn.addEventListener('click',()=>{moderationStatus=btn.dataset.status||'visible';document.querySelectorAll('.moderation-filter').forEach(x=>x.classList.toggle('is-active',x===btn));loadModeration();}));
  document.getElementById('addNotificationBtn').addEventListener('click', () => openNotificationForm(null));
  document.getElementById('addLearningEventBtn').addEventListener('click', () => openLearningEventForm(null));
  loadNotifications();
  loadModeration();
  loadModerationReplies();
  loadLearningEvents();
});

function notificationFieldHtml(f, record){
  const val = record ? (record.fields[f.key] ?? '') : (f.default ?? '');
  const req = f.required ? 'required' : '';
  if(f.type==='textarea') return `<div class="field"><label>${f.label}</label><textarea name="${f.key}" ${req}>${Utils.escapeHtml(val)}</textarea></div>`;
  if(f.type==='date') return `<div class="field"><label>${f.label}</label><input type="date" name="${f.key}" value="${Utils.escapeHtml(val)}" ${req}></div>`;
  if(f.type==='select') return `<div class="field"><label>${f.label}</label><select name="${f.key}" ${req}>${f.options.map(o=>`<option value="${Utils.escapeHtml(o.value)}" ${String(o.value)===String(val)?'selected':''}>${Utils.escapeHtml(o.label)}</option>`).join('')}</select></div>`;
  return `<div class="field"><label>${f.label}</label><input type="text" name="${f.key}" value="${Utils.escapeHtml(val)}" ${req}></div>`;
}

function openNotificationForm(id){
  const record=id?notificationRows.find(r=>r.id===id):null;
  const bodyHtml=`<form id="notificationForm" novalidate>${notificationSchema.fields.map(f=>notificationFieldHtml(f,record)).join('')}</form>`;
  Modal.open({title:record?'تعديل إشعار':'إضافة إشعار',bodyHtml,buttons:[
    {label:'إلغاء',className:'btn-secondary',onClick:()=>Modal.close()},
    {label:record?'حفظ التعديلات':'حفظ الإشعار',className:'btn-primary',onClick:btn=>saveNotification(record,btn)}
  ]});
}

async function saveNotification(record,btn){
  const form=document.getElementById('notificationForm');
  if(!form||!form.reportValidity()) return;
  const fields={};
  notificationSchema.fields.forEach(f=>{const el=form.elements[f.key]; if(el) fields[f.key]=el.value;});
  try{
    await Feedback.busy(btn,()=>record?Adapter.updateContent('announcements',record.id,fields):Adapter.createContent('announcements',fields),{busyLabel:'جارٍ الحفظ...',successMessage:record?'تم حفظ الإشعار':'تم إنشاء الإشعار',errorPrefix:'تعذّر حفظ الإشعار'});
    Modal.close(); await loadNotifications();
  }catch(e){}
}

async function loadNotifications(){
  const body=document.getElementById('notificationsBody'); if(!body)return;
  await Feedback.loadIntoTable(body,6,()=>Adapter.listNotifications(),rows=>{
    notificationRows=rows.map(r=>({id:r.id,fields:{Title:r.title||'',Type:r.type||'general',Status:r.status||'draft',Date:r.publish_at||'',Targets:r.targets||0,Reads:r.reads||0}}));
    body.innerHTML=notificationRows.length?notificationRows.map(r=>{const published=r.fields.Status==='published';return `<tr><td>${Utils.escapeHtml(r.fields.Title)}</td><td><span class="badge ${r.fields.Type==='urgent'?'badge-danger':'badge-info'}">${r.fields.Type==='urgent'?'عاجل':'عام'}</span></td><td><span class="badge ${published?'badge-success':'badge-warning'}">${published?'منشور':'مسودة'}</span></td><td>${r.fields.Date?Utils.formatDate(r.fields.Date):'—'}</td><td>${Utils.formatNumber(r.fields.Targets)}</td><td>${Utils.formatNumber(r.fields.Reads)}</td><td><div class="row-actions requires-edit"><button class="icon-btn" type="button" data-notify-action="edit" data-id="${Utils.escapeHtml(r.id)}" title="تعديل"><i class="fa-solid fa-pen"></i></button><button class="icon-btn" type="button" data-notify-action="send" data-id="${Utils.escapeHtml(r.id)}" ${published?'':'disabled'} title="${published?'إرسال':'يجب نشر الإشعار أولًا'}"><i class="fa-solid fa-paper-plane"></i></button><button class="icon-btn is-danger" type="button" data-notify-action="delete" data-id="${Utils.escapeHtml(r.id)}" title="حذف"><i class="fa-solid fa-trash"></i></button></div></td></tr>`}).join(''):'<tr><td colspan="7"><div class="empty-state"><i class="fa-solid fa-bell-slash"></i>لا توجد إشعارات بعد.</div></td></tr>';
  },{errorPrefix:'تعذّر تحميل الإشعارات'});
}

document.addEventListener('click',async ev=>{
  const btn=ev.target.closest('button[data-notify-action]'); if(!btn)return;
  const id=btn.dataset.id, action=btn.dataset.notifyAction, record=notificationRows.find(r=>r.id===id);
  if(action==='edit') return openNotificationForm(id);
  if(action==='send'){
    if(!record || record.fields.Status!=='published'){return;}
    const ok=await Modal.confirmDialog('سيتم تجهيز هذا الإشعار للتسليم إلى الطلاب المستهدفين. هل تريد المتابعة؟','إرسال الإشعار'); if(!ok)return;
    try{await Feedback.busy(btn,()=>Adapter.sendNotification(id),{busyLabel:'جارٍ الإرسال...',successMessage:'تم تجهيز الإشعار للتسليم',errorPrefix:'تعذّر إرسال الإشعار'}); await loadNotifications();}catch(e){}
  }
  if(action==='delete'){
    const ok=await Modal.confirmDialog('سيتم حذف الإشعار نهائيًا وإزالة أهدافه وطوابير التسليم المرتبطة به. هل أنت متأكد؟','حذف نهائي'); if(!ok)return;
    try{await Feedback.busy(btn,()=>Adapter.deleteContent('announcements',id),{busyLabel:'جارٍ الحذف...',successMessage:'تم حذف الإشعار نهائيًا',errorPrefix:'تعذّر حذف الإشعار'}); await loadNotifications();}catch(e){}
  }
});

function openLearningEventForm(id){
  const record=id?learningEventRows.find(r=>r.id===id):null;
  const f=record?.fields||{};
  const bodyHtml=`<form id="learningEventForm" novalidate>
    <div class="field"><label>اسم الحدث</label><input name="title" required value="${Utils.escapeHtml(f.title||'')}"></div>
    <div class="field"><label>الوصف</label><textarea name="description">${Utils.escapeHtml(f.description||'')}</textarea></div>
    <div class="field"><label>تصميم الحدث</label><select name="design"><option value="standard" ${f.design==='standard'?'selected':''}>قياسي</option><option value="challenge" ${f.design==='challenge'?'selected':''}>تحدي</option><option value="checklist" ${f.design==='checklist'?'selected':''}>قائمة مهام</option></select></div>
    <div class="field"><label>XP</label><input name="xp_reward" type="number" min="0" max="100" step="1" required value="${f.xp_reward??25}"></div>
    <div class="field"><label>مهام القائمة (اختياري، كل سطر مهمة)</label><textarea name="tasks">${Utils.escapeHtml(Array.isArray(f.tasks)?f.tasks.join('\n'):'')}</textarea></div>
    <div class="field"><label>القسم المستهدف (اختياري)</label><input name="target_department_id" value="${Utils.escapeHtml(f.target_department_id||'')}"></div>
    <div class="field"><label>الفصل المستهدف (اختياري)</label><input name="target_semester_id" value="${Utils.escapeHtml(f.target_semester_id||'')}"></div>
    <div class="field"><label>النشر</label><select name="status"><option value="draft" ${f.status!=='published'?'selected':''}>مسودة</option><option value="published" ${f.status==='published'?'selected':''}>منشور</option></select></div>
  </form>`;
  Modal.open({title:record?'تعديل حدث':'إضافة حدث',bodyHtml,buttons:[
    {label:'إلغاء',className:'btn-secondary',onClick:()=>Modal.close()},
    {label:record?'حفظ التعديلات':'حفظ الحدث',className:'btn-primary',onClick:btn=>saveLearningEvent(record,btn)}
  ]});
}
async function saveLearningEvent(record,btn){
  const form=document.getElementById('learningEventForm'); if(!form||!form.reportValidity())return;
  const tasks=String(form.elements.tasks?.value||'').split(/\r?\n/).map(x=>x.trim()).filter(Boolean);
  const fields={title:form.elements.title.value.trim(),description:form.elements.description.value.trim(),design:form.elements.design.value,xp_reward:Number(form.elements.xp_reward.value||0),target_department_id:form.elements.target_department_id.value.trim()||null,target_semester_id:form.elements.target_semester_id.value.trim()||null,status:form.elements.status.value,config_json:{tasks}};
  try{await Feedback.busy(btn,()=>record?Adapter.updateLearningEvent(record.id,fields):Adapter.createLearningEvent(fields),{busyLabel:'جارٍ الحفظ...',successMessage:record?'تم حفظ الحدث':'تم إنشاء الحدث',errorPrefix:'تعذّر حفظ الحدث'});Modal.close();await loadLearningEvents();}catch(e){}
}
async function loadLearningEvents(){
  const body=document.getElementById('learningEventsBody'); if(!body)return;
  await Feedback.loadIntoTable(body,6,()=>Adapter.listLearningEvents(),rows=>{
    learningEventRows=rows.map(r=>({id:r.id,fields:{title:r.title||'',description:r.description||'',design:r.design||'standard',xp_reward:Number(r.xp_reward||0),status:r.status||'draft',completions:Number(r.completions||0),target_department_id:r.target_department_id||'',target_semester_id:r.target_semester_id||'',tasks:Array.isArray(r.config)?r.config:((r.config&&Array.isArray(r.config.tasks))?r.config.tasks:[])}}));
    body.innerHTML=learningEventRows.length?learningEventRows.map(r=>`<tr><td>${Utils.escapeHtml(r.fields.title)}</td><td>${r.fields.design==='challenge'?'تحدي':r.fields.design==='checklist'?'قائمة مهام':'قياسي'}</td><td>${Utils.formatNumber(r.fields.xp_reward)}</td><td><span class="badge ${r.fields.status==='published'?'badge-success':'badge-warning'}">${r.fields.status==='published'?'منشور':'مسودة'}</span></td><td>${Utils.formatNumber(r.fields.completions)}</td><td><div class="row-actions requires-edit"><button class="icon-btn" type="button" data-event-action="edit" data-id="${Utils.escapeHtml(r.id)}" title="تعديل"><i class="fa-solid fa-pen"></i></button><button class="icon-btn is-danger" type="button" data-event-action="delete" data-id="${Utils.escapeHtml(r.id)}" title="حذف"><i class="fa-solid fa-trash"></i></button></div></td></tr>`).join(''):'<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-wand-magic-sparkles"></i>لا توجد أحداث بعد.</div></td></tr>';
  },{errorPrefix:'تعذّر تحميل الأحداث'});
}
document.addEventListener('click',async ev=>{
  const btn=ev.target.closest('button[data-event-action]');if(!btn)return;
  const id=btn.dataset.id,action=btn.dataset.eventAction;
  if(action==='edit')return openLearningEventForm(id);
  if(action==='delete'){const ok=await Modal.confirmDialog('سيتم حذف الحدث وإشعاره المرتبط نهائيًا. هل أنت متأكد؟','حذف نهائي');if(!ok)return;try{await Feedback.busy(btn,()=>Adapter.deleteLearningEvent(id),{busyLabel:'جارٍ الحذف...',successMessage:'تم حذف الحدث',errorPrefix:'تعذّر حذف الحدث'});await loadLearningEvents();}catch(e){}}
});

async function loadModeration(){
  const el=document.getElementById('list');
  await Feedback.loadInto(el,()=>Adapter.listModerationComments(moderationStatus),rows=>{
    el.innerHTML=rows.length?rows.map(r=>{const hidden=moderationStatus==='hidden';const deleted=moderationStatus==='deleted';return `<article class="list-row moderation-row"><div class="moderation-copy"><strong>${Utils.escapeHtml(r.full_name||'طالب')}</strong><div class="field-hint">${Utils.escapeHtml(r.content_type||'')} · ${Utils.formatDate(r.created_at)} · ${Number(r.reply_count||0)} ردود</div><p>${Utils.escapeHtml(r.body||'')}</p></div><div class="row-actions moderation-actions">${hidden?'<button type="button" class="btn btn-secondary" data-comment-action="moderate" data-id="'+Utils.escapeHtml(String(r.id))+'" data-status="visible">إعادة إظهار</button>':''}${!deleted&&!hidden?'<button type="button" class="btn btn-secondary" data-comment-action="moderate" data-id="'+Utils.escapeHtml(String(r.id))+'" data-status="hidden">إخفاء</button>':''}${!deleted?'<button type="button" class="btn btn-danger" data-comment-action="delete" data-id="'+Utils.escapeHtml(String(r.id))+'">حذف نهائي</button>':''}</div></article>`}).join(''):'<div class="empty-state"><i class="fa-solid fa-circle-check"></i>لا توجد تعليقات في هذه الحالة.</div>';
  },{errorPrefix:'تعذّر تحميل التعليقات'});
}

async function loadModerationReplies(){
  const el=document.getElementById('repliesList');
  await Feedback.loadInto(el,()=>Adapter.listModerationReplies(moderationReplyStatus),rows=>{
    el.innerHTML=rows.length?rows.map(r=>{const hidden=moderationReplyStatus==='hidden';const deleted=moderationReplyStatus==='deleted';return `<article class="list-row moderation-row"><div class="moderation-copy"><strong>${Utils.escapeHtml(r.full_name||'طالب')}</strong><div class="field-hint">رد على تعليق · ${Utils.escapeHtml(r.content_type||'')} · ${Utils.formatDate(r.created_at)}</div><p>${Utils.escapeHtml(r.body||'')}</p><small class="field-hint">التعليق الأصلي: ${Utils.escapeHtml(r.comment_body||'')}</small></div><div class="row-actions moderation-actions">${hidden?'<button type="button" class="btn btn-secondary" data-reply-action="moderate" data-id="'+Utils.escapeHtml(String(r.id))+'" data-status="visible">إعادة إظهار</button>':''}${!deleted&&!hidden?'<button type="button" class="btn btn-secondary" data-reply-action="moderate" data-id="'+Utils.escapeHtml(String(r.id))+'" data-status="hidden">إخفاء</button>':''}${!deleted?'<button type="button" class="btn btn-danger" data-reply-action="delete" data-id="'+Utils.escapeHtml(String(r.id))+'">حذف نهائي</button>':''}</div></article>`}).join(''):'<div class="empty-state"><i class="fa-solid fa-circle-check"></i>لا توجد ردود في هذه الحالة.</div>';
  },{errorPrefix:'تعذّر تحميل الردود'});
}

document.addEventListener('click',async ev=>{
  const btn=ev.target.closest('button[data-comment-action]'); if(!btn)return;
  const action=btn.dataset.commentAction,id=btn.dataset.id;
  if(action==='moderate'){try{await Feedback.busy(btn,()=>Adapter.moderateComment(id,btn.dataset.status),{busyLabel:'جارٍ التنفيذ...',successMessage:'تم تحديث حالة التعليق',errorPrefix:'تعذّر تحديث التعليق'});await loadModeration();}catch(e){}}
  if(action==='delete'){const ok=await Modal.confirmDialog('سيتم حذف التعليق وردوده نهائيًا من قاعدة البيانات. هل أنت متأكد؟','حذف نهائي');if(!ok)return;try{await Feedback.busy(btn,()=>Adapter.deleteCommentAdmin(id),{busyLabel:'جارٍ الحذف...',successMessage:'تم حذف التعليق',errorPrefix:'تعذّر حذف التعليق'});await loadModeration();}catch(e){}}
});

document.addEventListener('click',async ev=>{
  const btn=ev.target.closest('button[data-reply-action]'); if(!btn)return;
  const action=btn.dataset.replyAction,id=btn.dataset.id;
  if(action==='moderate'){try{await Feedback.busy(btn,()=>Adapter.moderateReply(id,btn.dataset.status),{busyLabel:'جارٍ التنفيذ...',successMessage:'تم تحديث حالة الرد',errorPrefix:'تعذّر تحديث الرد'});await loadModerationReplies();}catch(e){}}
  if(action==='delete'){const ok=await Modal.confirmDialog('سيتم حذف الرد نهائيًا من قاعدة البيانات. هل أنت متأكد؟','حذف نهائي');if(!ok)return;try{await Feedback.busy(btn,()=>Adapter.deleteReplyAdmin(id),{busyLabel:'جارٍ الحذف...',successMessage:'تم حذف الرد',errorPrefix:'تعذّر حذف الرد'});await loadModerationReplies();}catch(e){}}
});
</script>
</body></html>
