<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الطلاب | لوحة تحكم TRINEX</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
<script src="config.js"></script>
<script src="js/theme.js"></script>
<script src="js/auth.js"></script>
<style>
/* خاص بصفحة الطلاب فقط — الأزرار والحقول والأشرطة تعتمد على نظام admin.css الموحّد */
body[data-page="students"] .page-content { padding-top: 28px; }
body[data-page="students"] #pageContent > * {
  animation: studentsReveal .45s cubic-bezier(.2,.75,.3,1) both;
}
@keyframes studentsReveal {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}
.students-id {
  direction: ltr;
  text-align: right;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}

/* حرية حركة أدوات شريط الطلاب: يسمح لها بالالتفاف بدل التكدّس/القطع
   على الشاشات الضيقة، ويمنح البحث مساحة تكبر مع توفر العرض */
body[data-page="students"] .toolbar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}
body[data-page="students"] .toolbar .field {
  flex: 1 1 200px;
  min-width: 160px;
}
body[data-page="students"] .toolbar .field:first-child {
  flex: 2 1 240px;
}
@media (max-width: 700px) {
  body[data-page="students"] .toolbar {
    flex-direction: column;
    align-items: stretch;
  }
  body[data-page="students"] .toolbar .field,
  body[data-page="students"] .toolbar button {
    width: 100%;
  }
}
</style>
</head>
<body data-page="students">
<div id="app-shell"></div>
<template id="pageTemplate">
  <div class="page-intro">
    <div>
      <h2>إدارة الطلاب</h2>
      <p>السجل الداخلي للطلاب المستخدم للتحقق من هوية الطالب وبياناته الأكاديمية.</p>
    </div>
  </div>

  <div class="card">
    <div class="toolbar">
      <div class="field"><input id="searchInput" type="search" placeholder="ابحث بالرقم الجامعي أو اسم الطالب"></div>
      <div class="field"><select id="departmentFilter" aria-label="القسم"><option value="">كل الأقسام</option></select></div>
      <div class="field"><select id="semesterFilter" aria-label="الفصل"><option value="">كل الفصول</option></select></div>
      <div class="field"><select id="sortFilter" aria-label="ترتيب حسب">
        <option value="name">الاسم — أبجدي</option>
        <option value="department">القسم — ثم الاسم</option>
        <option value="studentId">الرقم الجامعي</option>
      </select></div>
      <button class="icon-btn" id="sortDirectionBtn" type="button" title="عكس الترتيب" aria-label="عكس الترتيب"><i class="fa-solid fa-arrow-down-a-z"></i></button>
      <button class="btn btn-primary requires-edit" id="addBtn" type="button"><i class="fa-solid fa-user-plus"></i> إضافة طالب</button>
      <button class="btn btn-secondary" id="refreshBtn" type="button"><i class="fa-solid fa-rotate"></i> تحديث القائمة</button>
    </div>
  </div>

  <div class="card" style="margin-top:18px">
    <div class="card-header">
      <div><h3>سجل الطلاب</h3><span class="card-header-hint" id="resultHint">جارٍ التحميل...</span></div>
    </div>
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>الرقم الجامعي</th><th>اسم الطالب</th><th>القسم</th><th>الفصل</th><th>الحالة</th><th></th></tr></thead>
        <tbody id="studentsBody"></tbody>
      </table>
    </div>
  </div>


</template>
<script src="js/api-adapter.js?v=3.0.0"></script>
<script src="js/utils.js"></script>
<script src="js/feedback.js"></script>
<script src="js/modal.js"></script>
<script src="js/layout.js"></script>
<script>
let studentData={records:[],departments:[],semesters:[],reverse:false};
const $=id=>document.getElementById(id);

document.addEventListener("shell:ready",async()=>{
  $("pageContent").appendChild($("pageTemplate").content.cloneNode(true));
  $("refreshBtn").addEventListener("click",loadStudents);
  $("searchInput").addEventListener("input",debounce(loadStudents,300));
  $("departmentFilter").addEventListener("change",loadStudents);
  $("semesterFilter").addEventListener("change",loadStudents);
  $("sortFilter").addEventListener("change",renderStudents);
  $("sortDirectionBtn").addEventListener("click",()=>{studentData.reverse=!studentData.reverse;updateSortButton();renderStudents();});
  $("addBtn").addEventListener("click",()=>openForm(null));
  $("studentsBody").addEventListener("click",(ev)=>{
    const btn=ev.target.closest("button[data-action]"); if(!btn) return;
    const id=btn.dataset.id; const action=btn.dataset.action;
    if(action==="retry-load") loadStudents();
    else if(action==="edit") openForm(id);
    else if(action==="toggle") toggleStudent(id, btn.dataset.active !== "1", btn);
    else if(action==="delete") deleteStudent(id, btn);
  });
  await loadStudents();
});

function debounce(fn,ms){let t;return()=>{clearTimeout(t);t=setTimeout(fn,ms)}}
function fillSelect(id,items,placeholder,valueKey,labelFn){
  const el=$(id);
  const first=`<option value="">${Utils.escapeHtml(placeholder||'')}</option>`;
  el.innerHTML=first+(items||[]).map(x=>{
    const value=valueKey?x?.[valueKey]:(x?.id??x?.value??x);
    const label=labelFn?labelFn(x):Utils.displayText(x);
    return `<option value="${Utils.escapeHtml(Utils.displayText(value,''))}">${Utils.escapeHtml(label)}</option>`;
  }).join("");
}
function setupOptions(){
  const departmentLabel=x=>x?.name_ar||x?.name_en||x?.name||x?.code||x?.id||'';
  const semesterLabel=x=>x?.name_ar||x?.name_en||x?.name||((x?.number!=null)?`الفصل ${x.number}`:'')||x?.id||'';
  fillSelect("departmentFilter",studentData.departments,"كل الأقسام","id",departmentLabel);
  fillSelect("semesterFilter",studentData.semesters,"كل الفصول","id",semesterLabel);
  fillSelect("department",studentData.departments,"اختر القسم","id",departmentLabel);
  fillSelect("semester",studentData.semesters,"اختر الفصل","id",semesterLabel);
}
async function loadStudents(){
  const body=$("studentsBody");if(!body)return;
  body.innerHTML=`<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i> جارٍ تحميل الطلاب...</div></td></tr>`;
  try{
    const filters={q:$("searchInput").value.trim(),department:$("departmentFilter").value,semester:$("semesterFilter").value};
    studentData=await Adapter.listStudentsAdmin(filters);
    setupOptions();
    $("departmentFilter").value=filters.department;
    $("semesterFilter").value=filters.semester;
    renderStudents();
  }catch(e){
    body.innerHTML=`<tr><td colspan="6"><div class="empty-state is-error"><i class="fa-solid fa-triangle-exclamation"></i>${Utils.escapeHtml(e.message||"تعذّر تحميل الطلاب")}<br><button class="btn btn-secondary" type="button" data-action="retry-load">إعادة المحاولة</button></div></td></tr>`;
    $("resultHint").textContent="فشل التحميل";
    Feedback.error(e.message||"تعذّر تحميل الطلاب");
  }
}
function compareStudents(a,b,mode){
  const av=mode==='department'?(a.department||''):(mode==='studentId'?(a.studentId||''):(a.name||''));
  const bv=mode==='department'?(b.department||''):(mode==='studentId'?(b.studentId||''):(b.name||''));
  const primary=String(av).localeCompare(String(bv),'ar',{numeric:true,sensitivity:'base'});
  if(primary!==0)return primary;
  if(mode==='department')return String(a.name||'').localeCompare(String(b.name||''),'ar',{numeric:true,sensitivity:'base'});
  return String(a.studentId||'').localeCompare(String(b.studentId||''),'ar',{numeric:true,sensitivity:'base'});
}
function updateSortButton(){
  const btn=$("sortDirectionBtn"); if(!btn)return;
  btn.innerHTML=studentData.reverse?'<i class="fa-solid fa-arrow-up-a-z"></i>':'<i class="fa-solid fa-arrow-down-a-z"></i>';
  btn.title=studentData.reverse?'الترتيب تصاعدي':'الترتيب تنازلي';
}
function renderStudents(){
  const body=$("studentsBody"),rows=[...(studentData.records||[])];
  const mode=$("sortFilter")?.value||'name';
  rows.sort((a,b)=>compareStudents(a,b,mode)*(studentData.reverse?-1:1));
  $("resultHint").textContent=`${rows.length} طالب`;
  updateSortButton();
  if(!rows.length){body.innerHTML=`<tr><td colspan="6"><div class="empty-state"><i class="fa-solid fa-user-slash"></i>لا توجد نتائج مطابقة.</div></td></tr>`;return}
  body.innerHTML=rows.map(r=>`<tr>
    <td class="students-id">${Utils.escapeHtml(r.studentId||"—")}</td>
    <td><strong>${Utils.escapeHtml(r.name||"—")}</strong></td>
    <td>${Utils.escapeHtml(r.departmentName || r.department || "—")}</td>
    <td>${Utils.escapeHtml(r.semesterName || Utils.displayText(r.semester))}</td>
    <td><span class="badge ${r.active?"badge-success":"badge-neutral"}">${r.active?"نشط":"معطّل"}</span></td>
    <td><div class="row-actions requires-edit">
      <button class="icon-btn" type="button" title="تعديل" data-action="edit" data-id="${Utils.escapeHtml(String(r.id))}"><i class="fa-solid fa-pen"></i></button>
      <button class="icon-btn" type="button" title="${r.active?"تعطيل":"تفعيل"}" data-action="toggle" data-id="${Utils.escapeHtml(String(r.id))}" data-active="${r.active ? "1" : "0"}"><i class="fa-solid ${r.active?"fa-toggle-off":"fa-toggle-on"}"></i></button>
      <button class="icon-btn is-danger" type="button" title="حذف" data-action="delete" data-id="${Utils.escapeHtml(String(r.id))}"><i class="fa-solid fa-trash"></i></button>
    </div></td>
  </tr>`).join("");
}
function getStudent(id){return(studentData.records||[]).find(r=>r.id===id)||null}
function openForm(id){
  const r=id?getStudent(id):null;
  const bodyHtml=`<form id="studentForm" novalidate>
    <input type="hidden" id="studentRecordId">
    <div class="schedule-form-grid">
      <div class="field"><label for="studentId">الرقم الجامعي</label><input id="studentId" class="students-id" type="text" required maxlength="100" autocomplete="off"></div>
      <div class="field"><label for="studentName">اسم الطالب</label><input id="studentName" type="text" required maxlength="150"></div>
      <div class="field"><label for="department">القسم</label><select id="department" required></select></div>
      <div class="field"><label for="semester">الفصل</label><select id="semester" required></select></div>
    </div>
    <div id="formError" class="login-feedback is-error" style="display:none"></div>
  </form>`;
  Modal.open({
    title:r?"تعديل طالب":"إضافة طالب",
    bodyHtml,
    buttons:[
      {label:"إلغاء",className:"btn-secondary",onClick:()=>Modal.close()},
      {label:r?"حفظ التعديلات":"حفظ",className:"btn-primary",onClick:(btn)=>saveForm(btn)}
    ]
  });
  fillSelect("department",studentData.departments||[],"اختر القسم","id", x=>Utils.displayText(x));
  fillSelect("semester",studentData.semesters||[],"اختر الفصل","id", x=>x?.name_ar||x?.name_en||(x?.number!=null?`الفصل ${x.number}`:x?.id));
  $("studentRecordId").value=r?.id||"";
  $("studentId").value=r?.studentId||"";
  $("studentName").value=r?.name||"";
  $("department").value=r?.department||"";
  $("semester").value=r?.semester?String(r.semester):"";
}
async function saveForm(btn){
  const form=$("studentForm"),err=$("formError");err.style.display="none";
  if(!form.checkValidity()){form.reportValidity();return;}
  const payload={studentId:$("studentId").value.trim(),name:$("studentName").value.trim(),department:$("department").value,semester:$("semester").value};
  if(!payload.studentId||!payload.name||!payload.department||!payload.semester){err.textContent="جميع الحقول مطلوبة.";err.style.display="block";return}
  const id=$("studentRecordId").value;
  try{
    await Feedback.busy(btn,()=>id?Adapter.updateStudentAdmin(id,payload):Adapter.createStudentAdmin(payload),{
      busyLabel:"جارٍ الحفظ...",
      successMessage:id?"تم حفظ بيانات الطالب":"تمت إضافة الطالب",
      errorPrefix:"تعذّرت العملية"
    });
    Modal.close();
    await loadStudents();
  }catch(e){err.textContent=e.message||"تعذّرت العملية";err.style.display="block"}
}
async function toggleStudent(id,active,btn){
  const ok=await Modal.confirmDialog(active?"هل تريد تفعيل هذا الطالب؟":"هل تريد تعطيل هذا الطالب؟",active?"تفعيل الطالب":"تعطيل الطالب");
  if(!ok)return;
  try{
    await Feedback.busy(btn,()=>Adapter.toggleStudentAdmin(id,active),{
      busyLabel:"جارٍ التنفيذ...",
      successMessage:active?"تم تفعيل الطالب":"تم تعطيل الطالب",
      errorPrefix:"تعذّرت العملية"
    });
    await loadStudents();
  }catch(e){}
}
async function deleteStudent(id,btn){
  const ok=await Modal.confirmDialog("سيتم حذف الطالب نهائيًا من السجل. هل أنت متأكد؟","حذف نهائي");
  if(!ok)return;
  try{
    await Feedback.busy(btn,()=>Adapter.deleteStudentAdmin(id),{
      busyLabel:"جارٍ الحذف...",
      successMessage:"تم حذف الطالب",
      errorPrefix:"تعذّر حذف الطالب"
    });
    await loadStudents();
  }catch(e){}
}
</script>
</body>
</html>
