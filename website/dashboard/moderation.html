<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الإشراف على التعليقات | لوحة التحكم</title><link rel="stylesheet" href="css/admin.css"><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet"><script src="config.js"></script><script src="js/theme.js"></script><script src="js/auth.js"></script></head><body data-page="moderation"><div id="app-shell"></div><template id="pageTemplate"><section class="card"><div class="card-header"><div><h3>الإشراف على التعليقات</h3><span class="card-header-hint">مراجعة وإخفاء أو إعادة إظهار التعليقات الرسمية</span></div><button class="btn btn-secondary" onclick="loadModeration()"><i class="fa-solid fa-rotate"></i> تحديث</button></div><div id="list"><div class="empty-state">جارٍ التحميل...</div></div></section></template><script src="js/api-adapter.js?v=2.8.0"></script><script src="js/utils.js"></script><script src="js/feedback.js"></script><script src="js/layout.js"></script><script>
document.addEventListener('shell:ready',()=>{document.getElementById('pageContent').appendChild(document.getElementById('pageTemplate').content.cloneNode(true));loadModeration();});
async function loadModeration(){const el=document.getElementById('list');try{const rows=await Adapter.listModerationComments('visible');el.innerHTML=rows.length?rows.map(r=>`<article class="list-row" style="align-items:flex-start"><div style="flex:1"><strong>${Utils.escapeHtml(r.full_name||'طالب')}</strong><div class="field-hint">${Utils.escapeHtml(r.content_type||'')} · ${Utils.formatDate(r.created_at)}</div><p>${Utils.escapeHtml(r.body||'')}</p></div><button class="btn btn-secondary" onclick="moderate('${r.id}','hidden')">إخفاء</button></article>`).join(''):'<div class="empty-state">لا توجد تعليقات معلّقة للمراجعة.</div>';}catch(e){el.innerHTML='<div class="empty-state is-error">تعذّر تحميل التعليقات.</div>';}}
async function moderate(id,status){try{await Adapter.moderateComment(id,status);await loadModeration();}catch(e){Feedback.error(e.message);}}
</script></body></html>
